name: 数据库每日备份
# 每天北京时间 04:00 把 Turso 数据库导出成 JSON，保存为 GitHub Actions 附件（保留 30 天）
# 启用：仓库 Settings → Secrets and variables → Actions，添加 TURSO_DATABASE_URL 和 TURSO_AUTH_TOKEN
on:
  schedule: [{ cron: '0 20 * * *' }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 导出
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then echo "没有配置 TURSO_DATABASE_URL，跳过"; exit 0; fi
          node server/cli.js dump farm-backup.json
      - uses: actions/upload-artifact@v4
        with: { name: farm-backup, path: farm-backup.json, retention-days: 30, if-no-files-found: ignore }
