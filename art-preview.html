<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>新角色预览</title>
<style>
:root{--panel:rgba(36,29,20,.92);--line:rgba(232,190,110,.35);--gold:#e8b84a;--ink:#f5ead2;--mut:#bfae8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfe6f5;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
#top{top:max(8px,env(safe-area-inset-top));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#top::-webkit-scrollbar{display:none}#top>*{flex:none}
#bot{bottom:max(8px,env(safe-area-inset-bottom))}
.bar b{color:#fff1cc;margin-right:4px;white-space:nowrap}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button.on{background:linear-gradient(#f1c95c,#c8902a);color:#2a1c08;border-color:#f6d77a;font-weight:700}
button:disabled{opacity:.4}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.chip{display:inline-flex;align-items:center;gap:5px}.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid var(--gold)}.seg button{border:0;border-radius:0}
#hud{position:fixed;right:10px;top:70px;z-index:2;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe9b0;white-space:pre}
#note{position:fixed;left:10px;top:70px;z-index:2;max-width:min(360px,60vw);padding:8px 10px;border-radius:10px;background:rgba(150,40,20,.88);border:1px solid #ffb08a;font-size:12.5px}
#note.v2{background:rgba(30,90,50,.9);border-color:#8fd8a0}
#concept{position:fixed;inset:0;z-index:5;background:rgba(10,8,5,.88);display:none;align-items:center;justify-content:center;padding:16px}
#concept.show{display:flex}#concept img{max-width:100%;max-height:100%;border-radius:10px}
#concept span{position:absolute;top:14px;right:16px;font-size:14px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--line)}
#load{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:#2a2116;color:#ffe9b0;font-size:15px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--gold);padding:8px 14px;border-radius:10px;display:none;max-width:90vw;text-align:center}
@media (max-width:600px){button{padding:6px 8px;font-size:13px}.bar{gap:5px;padding:6px}#note{max-width:58vw;font-size:11.5px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="load">正在加载新角色…</div>
<div class="bar" id="top"></div>
<div class="bar" id="bot"></div>
<div id="note"></div>
<div id="hud"></div>
<div id="concept"><img alt="设定图"><span>点任意处关闭</span></div>
<div id="toast"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/three-addons.js"></script>
<script src="shared/content.js"></script>
<script src="lib/assets3.js"></script>
<script src="lib/entity3.js"></script>
<script>
'use strict';
/* 美术交付预览：独立页面，不读写游戏存档，不影响游戏。
   V3（默认）：男主角 + 福旺的骨骼绑定和待机动作；走路由程序在骨骼上摆动（lib/entity3.js，和游戏里一样），等美术交 walk 后自动换成美术的动作。
   V2：Tripo 真实 3D 外观候选，静态模型（没有骨骼和动作），手机默认 1024 贴图，可切 2K 高清。
   V1：技术灰盒测试包（有 idle / walk），留作对照。 */
const PAGE_VER = 9;
const HEROINES = Array.from({ length: 14 }, (_, i) => { const k = 'heroine_' + String(i + 1).padStart(2, '0'); return [k, '女' + (i + 1), 'hero', null, 'h2_' + k]; });
const CLIP_NAME = { idle: '待机', walk: '走路', run: '跑步', jump_air: '跳（空中）', sit_idle: '坐', lie_idle: '趴', sleep: '睡觉', trot: '小跑', gallop: '奔跑', sprint: '冲刺' };
const VERS = {
  v4: { label: 'V5 动作', base: 'art/v5_motion/', rig: true, tiers: true, clips: true,
    roster: [['hero_boy', '男主角', 'hero', 'hero_boy', 'v4_hero_boy'], ['dog_fuwang', '福旺', 'dog', 'dog_fuwang', 'v4_dog_fuwang'], ['dog_ruibao', '睿宝', 'dog', 'dog_ruibao', 'v4_dog_ruibao']].concat(HEROINES),
    accBy: { hero_boy: [['bag', '挎包'], ['scarf', '围巾']], dog_fuwang: [['harness', '胸背带']], dog_ruibao: [['collar', '项圈'], ['tag', '吊牌']], heroine: [['bag', '提包'], ['hair', '头发']] },
    note: 'V5：美术交付的完整动作 —— 男主角和 14 位女主角走 / 跑 / 跳，福旺、睿宝坐 / 趴 / 睡 / 走 / 小跑 / 奔跑 / 冲刺。「边走边移动」按实测步幅移动，脚不打滑。' },
  v3: { label: 'V3 绑定+待机', base: 'art/v3_rig_idle/', rig: true, tiers: true,
    roster: [['hero_boy', '男主角', 'hero', 'hero_boy'], ['dog_fuwang', '福旺', 'dog', 'dog_fuwang']],
    acc: { hero: [['bag', '挎包'], ['scarf', '围巾']], dog: [['harness', '胸背带']] },
    note: 'V3：有骨骼和<b>待机</b>动作。「走路」是程序临时摆腿（美术还没交 walk）。可以在游戏「设置 → 新角色模型（测试）」里打开看实际效果。' },
  v2: { label: 'V2 外观', base: 'art/v2_static_review/', still: true,
    roster: [['hero_boy', '男主角', 'hero', 'hero_boy'], ['hero_girl', '女主角', 'hero', 'hero_girl'], ['dog_fuwang', '福旺', 'dog', 'dog_fuwang'], ['dog_ruibao', '睿宝', 'dog', 'dog_ruibao']],
    note: 'V2 外观候选（Tripo 3D）：<b>只看外观</b>，还没有骨骼和动作，也还没有放进游戏。' },
  v1: { label: 'V1 灰盒', base: 'art/v1_test/', still: false,
    roster: [['hero_boy', '男主角', 'hero', 'hero_boy'], ['hero_girl', '女主角', 'hero', 'hero_girl'], ['dog_collie', '边牧', 'dog', 'dog_fuwang']],
    note: 'V1「技术灰盒测试包」：只用来测试导入流程和手机性能，<b>不是最终外观</b>。' },
};
const COATS = [['fuwang', '福旺', '#8c96a4'], ['ruibao', '睿宝', '#e3a64a'], ['black', '黑白', '#222'], ['red', '巧克力红白', '#7a3a1e'], ['redmerle', '红陨石', '#c47a5a'], ['tri', '三色', '#3a2a20'], ['lilac', '丁香紫', '#a898a0'], ['slate', '石板蓝', '#5a6270'], ['merle', '蓝陌', '#9aa4b4'], ['gold', '黄白', '#e8b860']];
const ACC = { fuwang: { harness: 1, collar: 0, bandana: 0, tag: 0 }, ruibao: { harness: 0, collar: 1, bandana: 0, tag: 0 }, other: { harness: 0, collar: 0, bandana: 1, tag: 1 } };
const STRIDE = { hero: 0.64, dog: 0.27 }; /* V1 程序实测步幅（米/周期） */
const MORPH = { hero: [['blink', '眨眼'], ['smile', '微笑'], ['mouth_open', '张嘴'], ['surprise', '惊讶']], dog: [['blink', '眨眼'], ['pant', '哈气'], ['happy', '开心']] };
/* 观察距离：近看；按游戏漫游 / 俯视时大致的镜头距离和角度看（游戏里实际看到的大小） */
const VIEWS = { near: { label: '近看', fov: 34 }, walk: { label: '漫游距离', fov: 52, dist: 6.4, pitch: 0.42 }, top: { label: '俯视距离', fov: 30, dist: 26, pitch: 0.6 } };
const $ = id => document.getElementById(id), T = THREE;

/* ---------- 错误直接显示在屏幕上（手机上看不到控制台） ---------- */
function showErr(msg) { let e = $('err'); if (!e) { e = document.createElement('div'); e.id = 'err'; e.style.cssText = 'position:fixed;left:10px;right:10px;bottom:150px;z-index:8;padding:10px 12px;border-radius:10px;background:#7a1a10;color:#fff;border:1px solid #ffb08a;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:40vh;overflow:auto'; e.onclick = () => e.remove(); document.body.appendChild(e); } e.textContent = (e.textContent ? e.textContent + '\n' : '出错了（请截图发给 Claude，点这里关闭）：\n') + msg; }
addEventListener('error', e => showErr((e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')));
addEventListener('unhandledrejection', e => showErr('Promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
{ const oe = console.error.bind(console); console.error = (...a) => { showErr('错误：' + a.join(' ').slice(0, 600)); oe(...a); }; }

/* ---------- 场景 ---------- */
const R = new T.WebGLRenderer({ canvas: $('cv'), antialias: true, powerPreference: 'high-performance' });
R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.0; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
$('cv').addEventListener('webglcontextlost', () => showErr('WebGL 上下文丢失（手机显存不足或后台切换），请刷新页面'));
T.DefaultLoadingManager.onError = url => showErr('文件加载失败：' + url);
const scene = new T.Scene(); scene.background = new T.Color('#cfe6f5'); scene.fog = new T.Fog('#cfe6f5', 30, 80);
scene.add(new T.HemisphereLight(0xfff6e0, 0x6a8a4a, 0.85));
const sun = new T.DirectionalLight(0xfff0d8, 2.3); sun.position.set(4, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun); scene.add(sun.target);
{ const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#7fb85a'; x.fillRect(0, 0, 256, 256); for (let i = 0; i < 2600; i++) { x.fillStyle = `hsl(${92 + Math.random() * 20},${40 + Math.random() * 20}%,${36 + Math.random() * 16}%)`; x.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 3); }
  const tx = new T.CanvasTexture(c); tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(40, 40); tx.encoding = T.sRGBEncoding;
  const g = new T.Mesh(new T.CircleGeometry(60, 48), new T.MeshStandardMaterial({ map: tx, roughness: 1, side: T.DoubleSide })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g); }
/* 俯视距离时显示几块菜地和篱笆，方便判断角色在游戏里看起来有多大 */
const farm = new T.Group(); { const C = h => new T.Color(h).convertSRGBToLinear(); /* r149 里十六进制颜色按线性处理，不转换会发白 */ const soil = new T.MeshStandardMaterial({ color: C('#7a4a2a'), roughness: 1 }), crop = new T.MeshStandardMaterial({ color: C('#4f9a32'), roughness: 0.9 }), wood = new T.MeshStandardMaterial({ color: C('#8a5a32'), roughness: 0.9 });
  for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) { const p = new T.Mesh(new T.BoxGeometry(2.2, 0.25, 2.2), soil); p.position.set(-6.5 + i * 2.6, 0.12, -4.5 - j * 2.6); p.receiveShadow = true; farm.add(p); const c2 = new T.Mesh(new T.SphereGeometry(0.45, 10, 8), crop); c2.position.set(p.position.x, 0.55, p.position.z); c2.castShadow = true; farm.add(c2); }
  for (let i = 0; i < 9; i++) { const post = new T.Mesh(new T.BoxGeometry(0.15, 1, 0.15), wood); post.position.set(-8 + i * 2, 0.5, 3.5); post.castShadow = true; farm.add(post); }
  const rail = new T.Mesh(new T.BoxGeometry(16, 0.12, 0.08), wood); rail.position.set(0, 0.7, 3.5); farm.add(rail); farm.visible = false; scene.add(farm); }
const cam = new T.PerspectiveCamera(34, 1, 0.05, 200);
const orbit = { yaw: 0.5, pitch: 0.18, dist: 4.2, ty: 0.9 };
let fitK = 1;
function layout() { const w = innerWidth, h = innerHeight, tb = $('top').getBoundingClientRect().bottom, bt = $('bot').getBoundingClientRect().top; $('note').style.top = $('hud').style.top = (tb + 8) + 'px';
  const top = tb + 8, bot = Math.min(h, bt - 8), cy = (top + bot) / 2; fitK = view === 'near' ? Math.max(h > w ? 1.3 : 0.9, h / Math.max(120, bot - top) * 0.62) : 1; cam.setViewOffset(w, h, 0, h / 2 - cy, w, h); cam.updateProjectionMatrix(); hudFix(); }
function hudFix() { const nr = $('note').getBoundingClientRect(), hr = $('hud').getBoundingClientRect(); if (nr.right > hr.left - 6 && hr.top < nr.bottom) $('hud').style.top = (nr.bottom + 6) + 'px'; }
setInterval(hudFix, 1000);
function resize() { const w = innerWidth, h = innerHeight; R.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); layout(); }
addEventListener('resize', resize);

/* ---------- 资源加载 ---------- */
/* 资源统一由 lib/assets3.js 加载（清单来自 content/assets.jsonc；V0.1 起游戏也用同一个模块） */
const quiet = new Set();
const lib = new Assets3({ manifest: GAMECONTENT.ASSETS, onProgress: (id, k, b) => { if (!quiet.has(id)) progress(lib.info(id).name, k, b); } });
const aid = (n, v) => { const r = VERS[v || ver].roster.find(x => x[0] === n); return (r && r[4]) || (v || ver) + '_' + n; };
function progress(label, k, bytes) { const el = $('load'); const txt = `正在加载${label}… ${k ? Math.round(k * 100) + '%' : Math.round(bytes / 1024) + ' KB'}`; if (el) el.textContent = txt; else if (label) toast(txt, 800); }
const NAME = n => (VERS[ver].roster.find(r => r[0] === n) || [n, n])[1];
const coatTex = k => lib.texture(lib.info('v1_dog_collie').coats.replace('{coat}', k), true);
const stats = { loadMs: 0, glbMs: {}, fps: [], stress: null };

/* ---------- 状态 ---------- */
let ver = /[?&]v1\b/.test(location.search) ? 'v1' : /[?&]v2\b/.test(location.search) ? 'v2' : /[?&]v3\b/.test(location.search) ? 'v3' : 'v4', who = VERS[ver].roster[0][0], clip = 'idle', moving = false, coat = 'fuwang', hat = true, view = 'near', hi = false, cur = null, stress = null, showTok = 0;
function kindOf(n) { return (VERS[ver].roster.find(r => r[0] === n) || [])[2] || 'hero'; }
async function instance(n, tier) { const inst = await lib.spawn(aid(n), { tier }); const c = { inst, s: inst.object, id: aid(n) }; if (VERS[ver].rig) c.rig = new Entity3.Rig(inst, kindOf(n)); return c; }
let accOn = {};
const hiOK = () => VERS[ver].still || VERS[ver].tiers;
function drop(c) { if (!c) return; scene.remove(c.s); lib.release(c.inst); }
function play(c, name, fade) { if (c.rig) { c.rig.play(name, fade); c.clip = name; return; } const real = c.inst.play(name, fade); if (real) c.clip = real; }
const natural = (c, clip) => { const L = c.rig && c.rig.loco[clip]; return L ? L.stride / L.dur : 0; };
function step(c, dt, v) { if (c.rig) { c.rig.pace(v || natural(c, c.rig.real) || 1, 1); c.rig.update(dt); if (c.rig.faked && c.clip === 'walk') c.rig.autoGait(dt, v); const b = c.rig.liven(); c.s.position.y = b; } else c.inst.update(dt); }
function setAcc(s, map) { s.traverse(o => { if (o.name in map) o.visible = !!map[o.name]; }); }
async function setCoat(inst, k) { const t = await coatTex(k); inst.s.traverse(o => { if (o.isMesh) { const ms = [].concat(o.material).map(m => { if (m.name !== 'dog_coat') return m; if (!m.userData.own) { m = m.clone(); m.userData.own = 1; } m.map = t; m.needsUpdate = true; return m; }); o.material = Array.isArray(o.material) ? ms : ms[0]; } }); setAcc(inst.s, ACC[k] || ACC.other); }

async function show() { try { await show0(); } catch (e) { showErr('加载角色失败：' + (e.stack || e.message || e)); } }
async function show0() {
  const tok = ++showTok;
  if (stress) stopStress();
  const n = who, v = ver, t0 = performance.now(); if (lib.glb[aid(n)]) toast('正在加载' + NAME(n) + '…', 1200); quiet.delete(aid(n));
  if (tok !== showTok) return;
  const inst = await instance(n, hiOK() && hi ? '2k' : '1k'); inst.kind = kindOf(n); if (!stats.glbMs[aid(n)]) stats.glbMs[aid(n)] = Math.round(performance.now() - t0);
  if (tok !== showTok) { lib.release(inst.inst); return; }
  if (v === 'v1') { if (inst.kind === 'dog') await setCoat(inst, coat); else setAcc(inst.s, { hat, bag: 1, scarf: 1 }); }
  if (VERS[v].acc || VERS[v].accBy) setAcc(inst.s, accOn);
  if (tok !== showTok) return;
  drop(cur);
  cur = inst; scene.add(cur.s); applyView(true);
  if (!VERS[v].still) play(cur, clip, 0.01);
  renderBars();
}
/* 只在近看时用高清：离开这个角色时把高清贴图换回手机版，省显存 */
async function setHi(on) { hi = on; if (!cur || !hiOK()) return; toast(on ? '正在加载 2K 高清贴图…' : '换回手机版贴图', 1500); await lib.load(aid(who), on ? '2k' : '1k'); renderBars(); }
function applyView(keepYaw) { const V = VIEWS[view], k = cur ? cur.kind : 'hero'; cam.fov = V.fov; cam.updateProjectionMatrix(); farm.visible = view === 'top'; scene.fog.near = view === 'top' ? 70 : 30; scene.fog.far = view === 'top' ? 160 : 80;
  if (view === 'near') Object.assign(orbit, k === 'dog' ? { dist: VERS[ver].still ? 2.6 : 2.4, ty: 0.42 } : { dist: 4.2, ty: 0.9 }, keepYaw ? {} : { pitch: 0.18 });
  else Object.assign(orbit, { dist: V.dist, pitch: V.pitch, ty: k === 'dog' ? 0.3 : 0.8 });
  layout(); }

/* ---------- 按钮 ---------- */
function renderBars() {
  const V = VERS[ver];
  let t = `<b>新角色预览 <small style="color:#bfae8c;font-weight:400">页面 ${PAGE_VER}</small></b><span class="seg">${Object.keys(VERS).map(k => `<button data-ver="${k}" class="${k === ver ? 'on' : ''}">${VERS[k].label}</button>`).join('')}</span><span class="sep"></span>`;
  t += V.roster.map(([k, n]) => `<button data-who="${k}" class="${k === who ? 'on' : ''}">${n}</button>`).join('');
  t += '<span class="sep"></span>';
  if (V.clips) { const an = lib.info(aid(who)).anims || ['idle']; t += an.map(c => `<button data-clip="${c}" class="${clip === c ? 'on' : ''}">${CLIP_NAME[c] || c}</button>`).join('') + `<button id="move" class="${moving ? 'on' : ''}">边走边移动</button><button id="liven" class="${Entity3.Rig.LIVEN.on ? 'on' : ''}">放松跑姿</button><span class="sep"></span>`; }
  else if (!V.still) t += `<button data-clip="idle" class="${clip === 'idle' ? 'on' : ''}">待机</button><button data-clip="walk" class="${clip === 'walk' ? 'on' : ''}">走路${V.rig ? '（程序）' : ''}</button><button id="move" class="${moving ? 'on' : ''}">边走边移动</button><span class="sep"></span>`;
  t += `<button id="btn-concept">看设定图</button><button id="btn-stress" class="${stress || $('btn-stress') && $('btn-stress').classList.contains('on') ? 'on' : ''}">压力测试</button><button id="btn-copy">复制测试结果</button><a href="/"><button>回游戏</button></a>`;
  const top = $('top'), sl = top.scrollLeft; top.innerHTML = t; top.scrollLeft = sl;
  let b = `<b>距离</b><span class="seg">${Object.keys(VIEWS).map(k => `<button data-view="${k}" class="${k === view ? 'on' : ''}">${VIEWS[k].label}</button>`).join('')}</span>`;
  if (hiOK()) b += `<span class="sep"></span><b>贴图</b><span class="seg"><button data-hi="0" class="${hi ? '' : 'on'}">手机版 1K</button><button data-hi="1" class="${hi ? 'on' : ''}">高清 2K</button></span>`;
  const accList = V.accBy ? (V.accBy[who] || V.accBy.heroine) : V.acc ? V.acc[kindOf(who)] : null;
  if (accList) b += '<span class="sep"></span><b>配件</b>' + accList.map(([k, n]) => `<button data-acc="${k}" class="${accOn[k] !== false ? 'on' : ''}">${n}</button>`).join('');
  else if (V.still) { }
  else if (kindOf(who) === 'dog') b += '<span class="sep"></span><b>毛色</b>' + COATS.map(([k, n, c]) => `<button class="chip ${k === coat ? 'on' : ''}" data-coat="${k}"><i style="background:${c}"></i>${n}</button>`).join('');
  else b += `<span class="sep"></span><b>配件</b><button id="hat" class="${hat ? 'on' : ''}">草帽</button>`;
  if (ver === 'v1') b += '<span class="sep"></span><b>表情</b>' + MORPH[kindOf(who)].map(([k, n]) => `<button data-morph="${k}">${n}</button>`).join('');
  $('bot').innerHTML = b;
  $('note').innerHTML = V.note; $('note').className = V.still ? 'v2' : '';
  bind(); layout();
}
function bind() {
  document.querySelectorAll('[data-ver]').forEach(x => x.onclick = () => { if (x.dataset.ver === ver) return; ver = x.dataset.ver; who = VERS[ver].roster[0][0]; hi = false; show(); });
  document.querySelectorAll('[data-who]').forEach(x => x.onclick = () => { if (cur && hiOK() && hi && who !== x.dataset.who) lib.load(aid(who), '1k'); who = x.dataset.who; hi = false; show(); });
  document.querySelectorAll('[data-clip]').forEach(x => x.onclick = () => { clip = x.dataset.clip; if (clip === 'idle') moving = false; if (cur) play(cur, clip); renderBars(); });
  const lv = $('liven'); if (lv) lv.onclick = () => { Entity3.Rig.LIVEN.on = !Entity3.Rig.LIVEN.on; toast(Entity3.Rig.LIVEN.on ? '放松跑姿：开（程序叠加躯干扭转、前倾、摆臂、起伏）' : '放松跑姿：关（美术原动作）', 1600); renderBars(); };
  const mv = $('move'); if (mv) mv.onclick = () => { moving = !moving; if (moving) { if (!(cur && cur.rig && cur.rig.loco[clip])) clip = cur && cur.kind === 'dog' ? 'trot' : 'walk'; if (cur) play(cur, clip); } else if (cur) cur.s.position.set(0, 0, 0); renderBars(); };
  document.querySelectorAll('[data-view]').forEach(x => x.onclick = () => { view = x.dataset.view; applyView(); renderBars(); });
  document.querySelectorAll('[data-acc]').forEach(x => x.onclick = () => { const k = x.dataset.acc; accOn[k] = accOn[k] === false; if (cur) setAcc(cur.s, { [k]: accOn[k] }); renderBars(); });
  document.querySelectorAll('[data-hi]').forEach(x => x.onclick = () => setHi(x.dataset.hi === '1'));
  document.querySelectorAll('[data-coat]').forEach(x => x.onclick = async () => { coat = x.dataset.coat; if (cur) await setCoat(cur, coat); renderBars(); });
  const hb = $('hat'); if (hb) hb.onclick = () => { hat = !hat; if (cur) setAcc(cur.s, { hat }); renderBars(); };
  document.querySelectorAll('[data-morph]').forEach(x => x.onclick = () => { morphPulse = { k: x.dataset.morph, t: 0 }; });
  $('btn-concept').onclick = () => { const r = VERS[ver].roster.find(x => x[0] === who); $('concept').querySelector('img').src = !r[3] ? (lib.info(aid(who)).thumb || '') : 'art/concept/' + (ver === 'v1' && kindOf(who) === 'dog' && coat === 'ruibao' ? 'dog_ruibao' : r[3]) + '.jpg'; $('concept').classList.add('show'); };
  $('btn-stress').onclick = () => { const b = $('btn-stress'); if (b.classList.contains('on')) { if (stress) stopStress(); b.classList.remove('on'); show(); } else { stats.stress = null; b.classList.add('on'); startStress().catch(e => showErr('压力测试失败：' + (e.stack || e))); } };
  $('btn-copy').onclick = async () => { const txt = JSON.stringify(report(), null, 1); try { await navigator.clipboard.writeText(txt); toast('已复制，粘贴到和 Claude 的对话里就行'); } catch (e) { prompt('长按全选复制：', txt); } };
}
$('concept').onclick = () => $('concept').classList.remove('show');
let morphPulse = null;
function applyMorph(dt) { if (!cur || !morphPulse) return; morphPulse.t += dt; const v = Math.sin(Math.min(1, morphPulse.t / 1.2) * Math.PI); cur.s.traverse(o => { if (o.morphTargetDictionary && morphPulse.k in o.morphTargetDictionary) o.morphTargetInfluences[o.morphTargetDictionary[morphPulse.k]] = v; }); if (morphPulse.t > 1.2) morphPulse = null; }

/* ---------- 压力测试：1 个主角 + 10 只狗 ---------- */
async function startStress() {
  hi = false; /* 压力测试统一用手机版 1K 贴图 */
  toast('压力测试准备中…', 3000);
  const V = VERS[ver], heroN = kindOf(who) === 'hero' ? who : V.roster.find(r => r[2] === 'hero')[0], dogs = V.roster.filter(r => r[2] === 'dog').map(r => r[0]);
  if (ver === 'v1') await Promise.all(COATS.map(c => coatTex(c[0])));
  const list = [], h = await instance(heroN, '1k'); h.kind = 'hero'; if (!V.still) { setAcc(h.s, { hat: 1, bag: 1, scarf: 1 }); play(h, 'walk', 0.01); } if (V.rig) h.spd = 1.2; h.r = 1.6; h.ph = 0; h.spd = V.still ? 0.8 : STRIDE.hero; if (V.clips) h.spd = natural(h, 'walk') || 1.2; list.push(h);
  for (let i = 0; i < 10; i++) { const d = await instance(dogs[i % dogs.length], '1k'); d.kind = 'dog'; if (!V.still) { if (ver === 'v1') await setCoat(d, COATS[i][0]); play(d, 'walk', 0.01); if (d.inst.mixer) d.inst.mixer.setTime(i * 0.13); d.ts = V.rig ? 1 : 2.2; } d.r = 2.6 + (i % 3) * 1.1; d.ph = i * 0.63; d.spd = V.still ? 0.9 : V.rig ? 1.6 : STRIDE.dog * 2.2; if (V.clips) { play(d, 'trot', 0.01); d.spd = natural(d, 'trot') || d.spd; } list.push(d); }
  if (!$('btn-stress').classList.contains('on')) { list.forEach(x => lib.release(x.inst)); return; }
  drop(cur); cur = null;
  list.forEach(x => { x.s.position.set(Math.cos(x.ph) * x.r, 0, Math.sin(x.ph) * x.r); x.s.rotation.y = -x.ph; scene.add(x.s); });
  stress = { list, t: 0, frames: [] }; view = 'near'; farm.visible = false; renderBars(); Object.assign(orbit, { dist: 11, ty: 0.4, pitch: 0.5 }); cam.fov = 34; cam.updateProjectionMatrix(); layout();
  toast(`压力测试：1 个主角 + 10 只狗${V.still ? '（静态模型，只是绕圈移动）' : V.rig ? '（骨骼动画 + 程序步态）' : ''}，11 秒后出结果`);
}
function stopStress() { stress.list.forEach(drop); stress = null; }
function stepStress(dt) {
  stress.t += dt; stress.list.forEach(x => { x.ph += x.spd / x.r * dt; x.s.position.set(Math.cos(x.ph) * x.r, 0, Math.sin(x.ph) * x.r); x.s.rotation.y = -x.ph; if (x.inst.mixer) x.inst.mixer.timeScale = x.ts || 1; step(x, dt, x.spd); });
  if (stress.t > 1) stress.frames.push(dt);
  if (stress.t > 11 && !stats.stress) { const f = stress.frames, avg = f.reduce((a, b) => a + b, 0) / f.length, sorted = f.slice().sort((a, b) => b - a), p95 = sorted[Math.floor(sorted.length * 0.05)];
    stats.stress = { ver, tex: hiOK() && hi ? '2K' : '1K', avgFps: +(1 / avg).toFixed(1), lowFps: +(1 / p95).toFixed(1), calls: R.info.render.calls, tris: R.info.render.triangles };
    toast(`压力测试结果：平均 ${stats.stress.avgFps} 帧/秒，卡顿时 ${stats.stress.lowFps} 帧/秒。点「复制测试结果」发给 Claude`, 6000); }
}

function report() { let gpu = ''; try { const g = R.getContext(), e = g.getExtension('WEBGL_debug_renderer_info'); gpu = e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) { } const f = stats.fps.slice(-30);
  return { page: 'art-preview ' + PAGE_VER, ver, ua: navigator.userAgent, screen: `${screen.width}x${screen.height}@${devicePixelRatio}`, gpu, loadMs: stats.loadMs, glbMs: stats.glbMs, fps: f.length ? +(f.reduce((a, b) => a + b, 0) / f.length).toFixed(1) : null,
    stress: stats.stress || (stress && stress.frames.length ? { running: true, seconds: +stress.t.toFixed(1), avgFps: +(stress.frames.length / stress.frames.reduce((a, b) => a + b, 0)).toFixed(1), note: '还没跑满 11 秒' } : '没有运行（点「压力测试」，等 11 秒出结果后再复制）'), time: new Date().toISOString() }; }
let tt = 0; function toast(s, ms) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms || 2600); }

/* ---------- 拖动旋转视角，双指 / 滚轮缩放 ---------- */
const pts = new Map(); let pinch = 0;
$('cv').addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); try { $('cv').setPointerCapture(e.pointerId); } catch (x) { } if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
$('cv').addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return; if (pts.size === 2) { pts.set(e.pointerId, [e.clientX, e.clientY]); const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) orbit.dist = Math.max(0.8, Math.min(40, orbit.dist * pinch / d)); pinch = d; return; } orbit.yaw -= (e.clientX - p[0]) * 0.008; orbit.pitch = Math.max(0.03, Math.min(1.3, orbit.pitch + (e.clientY - p[1]) * 0.005)); pts.set(e.pointerId, [e.clientX, e.clientY]); });
['pointerup', 'pointercancel'].forEach(n => $('cv').addEventListener(n, e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; }));
$('cv').addEventListener('wheel', e => { orbit.dist = Math.max(0.8, Math.min(40, orbit.dist * (e.deltaY > 0 ? 1.08 : 0.93))); }, { passive: true });

/* ---------- 主循环 ---------- */
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { stats.fps.push(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  const focus = new T.Vector3(0, orbit.ty, 0);
  if (stress) stepStress(dt);
  else if (cur) { step(cur, dt, moving ? natural(cur, cur.rig ? cur.rig.real : '') || (cur.kind === 'dog' ? 1.6 : 1.2) : 0); applyMorph(dt);
    if (moving && cur.clip === 'walk') { const sp = natural(cur, cur.rig ? cur.rig.real : '') || (VERS[ver].rig ? (cur.kind === 'dog' ? 1.6 : 1.2) : STRIDE[cur.kind]); cur.ang = (cur.ang || 0) + sp / 2 * dt; cur.s.position.set(Math.sin(cur.ang) * 2, 0, Math.cos(cur.ang) * 2 - 2); cur.s.rotation.y = cur.ang + Math.PI / 2; focus.set(cur.s.position.x, orbit.ty, cur.s.position.z); } }
  const dd = orbit.dist * fitK; cam.position.set(focus.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * dd, focus.y + Math.sin(orbit.pitch) * dd, focus.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * dd);
  if (cam.position.y < 0.25) cam.position.y = 0.25; /* 镜头不能钻到地面下面 */
  cam.lookAt(focus); sun.position.set(focus.x + 4, 8, focus.z + 5); sun.target.position.copy(focus);
  R.render(scene, cam);
  const f = stats.fps.length ? stats.fps[stats.fps.length - 1] : 0, i = R.info.render;
  $('hud').textContent = `帧率 ${f.toFixed(0)} 帧/秒\n绘制 ${i.calls} 次  三角面 ${(i.triangles / 1000).toFixed(1)}k${stress && !stats.stress ? `\n压力测试中，还剩 ${Math.max(0, 11 - stress.t).toFixed(0)} 秒` : ''}${stats.stress ? `\n压力测试：平均 ${stats.stress.avgFps}，最低 ${stats.stress.lowFps} 帧/秒` : ''}`;
  requestAnimationFrame(frame);
}
renderBars(); resize();
(async () => { const t0 = performance.now(); await show(); stats.loadMs = Math.round(performance.now() - t0); if ($('load')) $('load').remove(); requestAnimationFrame(frame);
  /* 第一个角色出来后，后台预加载同一版本的其他角色 */
  setTimeout(() => VERS[ver].roster.forEach(r => { quiet.add(aid(r[0])); lib.load(aid(r[0])).catch(() => { }); }), 500); })();
window.__art = { report, stats, get cur() { return cur; } };
window.__dbg = () => stress ? stress.list.map(x => [x.s.position.x, x.s.position.z]) : null; window.__camY = () => cam.position.y;
</script>
