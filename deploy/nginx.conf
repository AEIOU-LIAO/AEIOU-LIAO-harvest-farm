# Nginx 反向代理：所有请求转给本机 Node 服务（端口 3000）
# sudo cp deploy/nginx.conf /etc/nginx/conf.d/harvest-farm.conf，把 server_name 改成你的域名
# HTTPS：装好后执行 sudo certbot --nginx -d farm.example.com 自动签发证书
server {
    listen 80;
    server_name _;                    # 例如 farm.peiqi1.top
    client_max_body_size 64k;
    gzip on; gzip_types application/json text/html text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
