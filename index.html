<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1610">
<!-- 接口地址：留空表示和页面同域（推荐，由 Node 服务直接提供页面）；前端单独托管时填 API 域名，如 https://api.example.com -->
<meta name="farm-api" content="">
<title>丰收农场</title>
<style>
/* =====================================================
   丰收农场 · 界面样式（深色鎏金）
   ===================================================== */
:root{
  --ink:#f3e9d2; --ink2:#d9c8a4; --mut:#a8977a; --gold:#e6c47a; --gold2:#b98b3e; --gold3:#8a6528;
  --panel:rgba(22,18,13,.78); --panel2:rgba(34,28,20,.94); --line:rgba(230,196,122,.38); --line2:rgba(230,196,122,.18);
  --green:#6fbf5a; --green2:#3f8a3a; --red:#e06a52; --blue:#6fb8e8;
  --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1510;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;font-size:14px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.ico{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.mi{width:15px;height:15px;margin:-2px 4px 0 0;color:var(--gold)}
.cn{display:inline-block;width:.95em;height:.95em;margin:-.15em .25em 0 0;vertical-align:middle;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c0,#f0c24a 45%,#b07a14);box-shadow:inset 0 0 0 1.5px rgba(120,76,8,.65)}
.gold{color:var(--gold)}
b{font-weight:700}

/* ---------- 毛玻璃面板通用 ---------- */
#card,.pill,#rightbtns button,#titlebar #title,.sbtn,#newbie,#friends,#toolbar,#tip,.toast,#log{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh),inset 0 1px 0 rgba(255,240,200,.08);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:3}
#topbar>*{pointer-events:auto}
#card{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:40px;cursor:pointer;transition:border-color .2s}
#card:hover{border-color:var(--gold)}
#avatar{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);background:#2a2218}
#card .info{display:flex;flex-direction:column;gap:4px;min-width:150px}
#card .nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap}
#lvbadge{font-size:11px;font-weight:800;color:#2a1c08;background:linear-gradient(#f3d690,#c9973f);padding:1px 7px;border-radius:6px;letter-spacing:0}
#ptitle{font-size:10.5px;color:#e8d8ff;border:1px solid rgba(190,160,255,.5);background:rgba(120,90,200,.25);border-radius:6px;padding:0 6px;font-weight:600}
.expbar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#expfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b98b3e,#f3d690);border-radius:3px;transition:width .5s;box-shadow:0 0 8px rgba(243,214,144,.6)}
#exptext{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:7px;height:40px;padding:0 16px 0 8px;border-radius:22px;margin-top:6px;font-weight:700;font-size:17px;color:#ffe7a6;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.coin{display:flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#5a3a08;background:radial-gradient(circle at 35% 30%,#fff3c0,#f0c24a 50%,#b07a14);box-shadow:0 0 10px rgba(240,194,74,.45)}
.coin .ico{width:17px;height:17px;stroke-width:2.2}
#gold.bump b{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18);color:#fff}}
#rightbtns{margin-left:auto;display:flex;gap:8px;margin-right:2px}
#rightbtns button{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);transition:transform .15s,border-color .15s}
#rightbtns button:hover{transform:translateY(-1px);border-color:var(--gold)}
#rightbtns .ico{width:20px;height:20px}
#titlebar{position:fixed;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;z-index:2}
#title{display:flex;flex-direction:column;align-items:center;padding:7px 28px 6px;border-radius:10px;min-width:180px}
#title span{font-size:16px;font-weight:700;letter-spacing:2px;background:linear-gradient(#fff4d6,#e6c47a);-webkit-background-clip:text;background-clip:text;color:transparent}
#title small{font-size:11px;color:var(--mut);margin-top:1px;letter-spacing:.5px}

/* ---------- 左侧入口 ---------- */
#side{position:fixed;left:12px;top:84px;display:flex;flex-direction:column;gap:8px;z-index:2}
.sbtn{position:relative;width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--gold);transition:transform .15s,border-color .15s}
.sbtn .ico{width:21px;height:21px}
.sbtn em{font-style:normal;font-size:10.5px;color:var(--ink2);letter-spacing:.5px}
.sbtn:hover{transform:translateX(2px);border-color:var(--gold)}
.sbtn.ev{border-color:rgba(255,140,120,.7);animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 16px rgba(255,140,100,.55),var(--sh)}}
.bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:linear-gradient(#ff7a5a,#d8442a);color:#fff;font:700 11px/18px var(--font);text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.bd.al{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#newbie{position:fixed;left:76px;top:84px;width:158px;padding:9px 12px 10px;border-radius:12px;cursor:pointer;z-index:2;border-color:rgba(140,210,110,.55)}
#newbie b{display:block;font-size:13px;color:#cdf3b4;letter-spacing:.5px}
#newbie small{display:block;font-size:11px;color:var(--mut);margin:2px 0 6px}
#newbie .np{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}#newbie .np i{display:block;height:100%;background:linear-gradient(90deg,#4f9a3a,#a8e878)}
#newbie .bd{top:-7px;right:-7px}

/* ---------- 右侧玩家栏 ---------- */
#friends{position:fixed;right:12px;top:66px;width:84px;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border-radius:16px;max-height:calc(100vh - 186px);z-index:2}
.ftabs{display:flex;gap:2px;background:rgba(0,0,0,.25);border-radius:8px;padding:2px;margin-bottom:2px}
.ftabs button{flex:1;border:0;background:transparent;font-size:11px;padding:4px 0;border-radius:6px;color:var(--mut);white-space:nowrap}
.ftabs button.on{background:linear-gradient(#e6c47a,#b98b3e);color:#2a1c08;font-weight:700}
.flist{display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;min-height:40px}
.flist::-webkit-scrollbar{display:none}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.fr img{width:42px;height:42px;border-radius:50%;border:2px solid rgba(230,196,122,.55);background:#2a2218}
.fr span{font-size:11px;margin-top:3px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fr small{font-size:9.5px;color:var(--mut)}
.fr:hover{background:rgba(255,230,170,.08)}
.fr.on{background:rgba(230,196,122,.16);border-color:var(--line)}
.fr .on{position:absolute;left:12px;top:6px;width:10px;height:10px;border-radius:50%;background:#5fd04a;border:2px solid #1d1710;box-shadow:0 0 6px #5fd04a}
.fr .bd{top:0;right:4px}.fr .bd.hp{top:24px;background:linear-gradient(#6fc85a,#3f8a3a)}
.fr.me{border-bottom:1px solid var(--line2);border-radius:10px 10px 4px 4px;margin-bottom:2px}
.fr.add .plus{width:42px;height:42px;border-radius:50%;border:1.5px dashed var(--gold2);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.fempty{font-size:11px;color:var(--mut);text-align:center;padding:10px 2px;line-height:1.5}

/* ---------- 消息条 ---------- */
#log{position:fixed;left:76px;bottom:104px;max-width:380px;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.75;cursor:pointer;z-index:2}
#log.empty{display:none}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}#log b{color:var(--gold);font-weight:600}#log small{color:var(--mut);font-size:11px}
#log .new{color:var(--ink)}#log .more{color:var(--gold);font-weight:600}

/* ---------- 底部工具栏 ---------- */
#toolbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:6px 8px;border-radius:18px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;z-index:3}
#toolbar::-webkit-scrollbar{display:none}
.tbtn{position:relative;width:64px;height:62px;flex:none;border:1px solid transparent;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .15s,border-color .15s,transform .12s}
.tbtn .ic{height:28px;display:flex;align-items:center;color:var(--gold)}
.tbtn .ic .ico{width:24px;height:24px}
.tbtn .ic img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.tbtn .tx{font-size:11.5px;color:var(--ink2);letter-spacing:.5px;white-space:nowrap}
.tbtn:hover{background:rgba(255,230,170,.08);transform:translateY(-2px)}
.tbtn:active{transform:translateY(0)}
.tbtn.on{background:linear-gradient(rgba(230,196,122,.28),rgba(185,139,62,.18));border-color:var(--gold)}
.tbtn.on .tx{color:#fff4d6}
.tbtn .bd{top:3px;right:5px}

/* ---------- 提示 / 光标 / 飘字 ---------- */
#tip{position:fixed;left:0;top:0;pointer-events:none;display:none;min-width:150px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.6;z-index:5;color:var(--ink2)}
#tip b{color:var(--gold);font-size:14px}#tip .warn{color:#ffb39e;font-weight:600}#tip .ok{color:#b8ef8f;font-weight:600}
#tip .bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:5px;overflow:hidden}#tip .bar i{display:block;height:100%;background:linear-gradient(90deg,#4f9a3a,#a8e878)}
#curtool{position:fixed;left:0;top:0;pointer-events:none;display:none;z-index:6;color:#fff4d6;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
#curtool .ico{width:28px;height:28px}#curtool img{width:38px;height:38px;opacity:.92}
#fx3d{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ftxt{position:absolute;left:0;top:0;font-weight:800;white-space:nowrap;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.6),0 0 1px #000}

/* ---------- toast / 网络 / 加载 ---------- */
#toasts{position:fixed;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{padding:8px 18px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink);animation:tin .3s ease-out,tout .4s 2.4s forwards;white-space:nowrap}
.toast.warn{border-color:rgba(255,140,110,.6);color:#ffd8cc}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#netbar{position:fixed;left:50%;top:0;transform:translate(-50%,-110%);padding:8px 18px;border-radius:0 0 12px 12px;background:#8a2e1e;color:#fff;font-weight:600;font-size:13px;z-index:60;transition:transform .3s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#netbar.show{transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#3a2e1e,#14100b 70%);z-index:70;transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#loading p{color:var(--mut);font-size:13px;letter-spacing:1px}#loading a{color:var(--gold)}
.lt,.logo{display:flex;flex-direction:column;align-items:center}
.lt span,.logo span{font-size:38px;font-weight:800;letter-spacing:8px;background:linear-gradient(#fff6dc,#e6c47a 55%,#a8782e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.lt em,.logo em{font-style:normal;font-size:11px;letter-spacing:6px;color:var(--gold2);margin-top:2px}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(230,196,122,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 弹窗 ---------- */
#mback{position:fixed;inset:0;background:rgba(8,6,4,.55);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#mback.show{display:flex}
#modal{position:relative;width:min(580px,94vw);max-height:88vh;overflow:auto;padding:22px 24px 22px;border-radius:18px;background:linear-gradient(170deg,rgba(46,38,27,.98),rgba(24,20,14,.98));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,240,200,.1);animation:pop .28s cubic-bezier(.2,1.2,.4,1);scrollbar-width:thin;scrollbar-color:var(--gold3) transparent}
#modal::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#modal.small{width:min(430px,92vw)}#modal.wide{width:min(800px,95vw)}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}}
#modal h2{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 14px;font-size:19px;font-weight:700;letter-spacing:3px;color:#fff1cc}
#modal h2 .ico{color:var(--gold);width:22px;height:22px}
#modal h3{margin:6px 0 8px;font-size:16px;color:#fff1cc;letter-spacing:1px}
#modal .sub{text-align:center;margin:-8px 0 14px;font-size:12.5px;color:var(--mut)}
#modal .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--ink2);z-index:2}
#modal .x:hover{color:#fff;border-color:var(--gold)}#modal .x .ico{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:rgba(255,240,200,.05);color:var(--ink);font-weight:600;font-size:14px;letter-spacing:.5px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn .ico{width:17px;height:17px}
.btn:hover{border-color:var(--gold);background:rgba(255,240,200,.1)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#f0d48e,#c4943f);border-color:#f6dfa6;color:#2a1c08;box-shadow:0 4px 14px rgba(196,148,63,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary:hover{background:linear-gradient(#f6dc9c,#cfa04a)}
.btn.danger{background:rgba(200,70,50,.18);border-color:rgba(230,110,90,.6);color:#ffcfc4}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn.big{padding:11px 34px;font-size:16px;border-radius:12px;letter-spacing:2px}
.btn:disabled{opacity:.42;cursor:default;transform:none;box-shadow:none}
.tabs{display:flex;gap:4px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tabs button{position:relative;padding:6px 16px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.2);color:var(--mut);font-size:13px;font-weight:600;letter-spacing:.5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:linear-gradient(rgba(230,196,122,.3),rgba(185,139,62,.2));border-color:var(--gold);color:#fff1cc}
.tabs .bd{top:-8px;right:-8px}
.list{max-height:52vh;overflow:auto;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line2);padding:2px 12px;scrollbar-width:thin;scrollbar-color:var(--gold3) transparent}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line2)}.row-item:last-child{border-bottom:0}
.row-item.new{background:linear-gradient(90deg,rgba(230,196,122,.1),transparent)}
.ri-ic{width:50px;height:50px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 35%,rgba(255,240,200,.16),rgba(0,0,0,.25));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ii{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px}.ii .cimg{width:44px;height:44px;object-fit:contain}
.ii.emo{color:var(--gold)}.ii.emo .ico{width:24px;height:24px}.ii.gold{background:radial-gradient(rgba(255,220,120,.35),transparent 70%)}.ii.red{color:#ff8a6a}.ii.soil1{color:#ff8a6a}.ii.soil2{color:#b8aa98}.ii.soil3{color:#ffd23a;background:radial-gradient(rgba(255,210,60,.3),transparent 70%)}.ii.dog-fuwang{color:#c8d2e0}.ii.dog-ruibao{color:#ffcf5a}
.ri-main{flex:1;min-width:0;line-height:1.5}.ri-main b{font-size:14.5px;color:var(--ink)}.ri-main small{display:block;color:var(--mut);font-size:12px}
.ri-n{font-weight:700;font-size:16px;min-width:52px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
.price{font-weight:700;color:#ffe7a6;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:36px 12px;color:var(--mut);line-height:1.7}
.hots{text-align:center;min-height:4px;margin-bottom:8px;font-size:12.5px;color:var(--mut)}.hot{color:#ffb07a;margin:0 4px}.hot .mi{color:#ff8a4a}
.sellall{text-align:center;padding:12px 0 4px}
.mygold{text-align:right;color:#ffe7a6;margin:-4px 4px 8px;font-weight:600}
.seedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:58vh;overflow:auto;padding:4px}
.seedcard{position:relative;padding:10px 10px 8px;text-align:center;border-radius:14px;background:linear-gradient(rgba(255,240,200,.06),rgba(0,0,0,.2));border:1px solid var(--line2);cursor:pointer;transition:transform .15s,border-color .15s}
.seedcard:hover{transform:translateY(-3px);border-color:var(--line)}
.seedcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(230,196,122,.25)}
.seedcard .sci{height:78px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,rgba(255,240,200,.14),transparent 70%)}
.seedcard .cimg{width:76px;height:76px;object-fit:contain}
.seedcard h4{margin:4px 0 6px;font-size:15px;color:#fff1cc;letter-spacing:1px}
.seedcard .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);line-height:1.75;padding:0 4px}
.seedcard .tag{position:absolute;left:8px;top:8px;font-style:normal;font-size:10.5px;color:#cdf3b4;border:1px solid rgba(140,210,110,.5);border-radius:6px;padding:0 5px}
.seedcard .rar{position:absolute;right:8px;top:8px;font-style:normal;font-size:10.5px;border-radius:6px;padding:0 6px;color:#bfe4ff;border:1px solid rgba(110,180,230,.6)}
.seedcard.r3 .rar{color:#e2ccff;border-color:rgba(180,140,255,.6)}.seedcard.r4 .rar{color:#ffd8a8;border-color:rgba(255,170,80,.7)}
.seedcard.r2{border-color:rgba(110,180,230,.35)}.seedcard.r3{border-color:rgba(180,140,255,.4)}.seedcard.r4{border-color:rgba(255,170,80,.5)}
.seedcard.lock{filter:saturate(.3) brightness(.8)}
.lockmask{position:absolute;inset:0;border-radius:13px;background:rgba(10,8,5,.55);color:var(--ink2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px}

  let TZ_MIN = 480;
  function setTz(min) { TZ_MIN = min; }
  function dayKey(ms) { const d = new Date(ms + TZ_MIN * 60000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  function dayStart(ms) { const off = TZ_MIN * 60000; return Math.floor((ms + off) / 86400000) * 86400000 - off; }
  function weekKey(ms) { // ISO 周（按服务器时区）
    const d = new Date(dayStart(ms) + TZ_MIN * 60000); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3);
    const y = d.getUTCFullYear(), jan4 = new Date(Date.UTC(y, 0, 4)); const w = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
    return y + '-W' + String(w).padStart(2, '0');
  }

function openSeeds() {
  const cards = CROPS.slice().sort((a, b) => a.lv - b.lv || a.seed - b.seed).map(c => {
    const lock = S.me.lv < c.lv, per = Math.floor(c.yield * c.price), perH = Math.round((per - c.seed) / (c.time / 3600));
    return `<div class="seedcard r${c.rarity}${lock ? ' lock' : ''}${S.me.seed === c.id ? ' sel' : ''}" data-id="${c.id}">
      ${c.seasons > 1 ? '<em class="tag">两季</em>' : ''}${c.rarity > 1 ? `<em class="rar">${CFG.RARITY[c.rarity]}</em>` : ''}<div class="sci">${iconImg(c.id)}</div><h4>${c.name}</h4>
      <div class="meta"><span>${G(c.seed)}</span><span>${ICON('clock', 'mi')}${fmtTime(c.time)}</span></div>
      <div class="meta"><span>产量 ${c.yield}</span><span>售价 ${fmt(per)}</span></div><div class="meta"><span>经验 ${c.exp}</span><span title="每小时净收益">${fmt(perH)}/时</span></div>

async function openTasks(tab) {
  const T = await getj('/api/tasks'); if (!T) return; const nbLeft = T.newbie.filter(x => !x.claimed).length;
  tab = tab || (S.badges.newbie ? 'newbie' : 'daily');
  const row = (def, st, kind) => { const p = Math.min(st.need, st.prog), ok = st.prog >= st.need; return `<div class="row-item task${st.claimed ? ' got' : ''}"><div class="ri-ic"><span class="ii emo">${ICON(TASK_IC[def.id] || 'sprout')}</span></div><div class="ri-main"><b>${def.tx}</b><div class="pbar"><i style="width:${p / st.need * 100}%"></i><span>${fmt(p)}/${fmt(st.need)}</span></div><small>奖励 ${G(def.gold)}${def.exp ? ' · 经验 ' + def.exp : ''}</small></div><button class="btn sm ${ok && !st.claimed ? 'primary' : ''}" data-claim="${def.id}" data-kind="${kind}" ${ok && !st.claimed ? '' : 'disabled'}>${st.claimed ? '已领取' : ok ? '领取' : '进行中'}</button></div>`; };
  let body = '';
  if (tab === 'daily') {
    const done = S.me.checkin.last === T.day, n = done ? ((S.me.checkin.streak - 1) % 7) + 1 : (S.me.checkin.streak % 7) + 1;
    const days = [1, 2, 3, 4, 5, 6, 7].map(d => `<div class="day${(done ? d <= n : d < n) ? ' got' : ''}${!done && d === n ? ' today' : ''}"><small>第${d}天</small><b>${d * 100}</b>${d % 3 === 0 ? '<em>+化肥</em>' : ''}${d === 7 ? '<em>+狗粮</em>' : ''}</div>`).join('');
    body = `<div class="checkin"><div class="cih"><b>${ICON('calendar', 'mi')}每日签到</b><span>已连续 ${S.me.checkin.streak} 天 · 每天 0 点（北京时间）刷新</span><button class="btn sm primary" id="checkin" ${done ? 'disabled' : ''}>${done ? '今日已签' : '签到'}</button></div><div class="days">${days}</div></div>

}
async function openCodex() {
  const r = await getj('/api/codex'); if (!r) return; const got = {}; r.list.forEach(x => got[x.item] = x);
  const cell = (k, c, gold) => { const g = got[k]; return `<div class="cx${g ? ' on' : ''}${gold ? ' gold' : ''} r${c.rarity}" title="${g ? `首次获得：${new Date(g.first_at).toLocaleDateString()}，累计 ${g.n}` : '未获得'}"><img class="cimg" src="${cropIcon(c.id, gold)}"><b>${gold ? '金色' : ''}${g ? c.name : '？？？'}</b><small>${CFG.RARITY[c.rarity]}${g ? ' · ×' + fmt(g.n) : ''}</small></div>`; };
  const n = CROPS.filter(c => got['c' + c.id]).length, ng = CROPS.filter(c => got['g' + c.id]).length;
  openModal(`${H2('book', '作物图鉴', `普通 ${n}/${CROPS.length} · 金色变异 ${ng}/${CROPS.length}（每次收获有 ${Math.round(RULES.goldenChance * 100)}% 几率变异）`)}
    <h4 class="sec">普通作物</h4><div class="codex">${CROPS.map(c => cell('c' + c.id, c)).join('')}</div><h4 class="sec">金色变异</h4><div class="codex">${CROPS.map(c => cell('g' + c.id, c, true)).join('')}</div>`, { wide: true });
}
function openEvents() {
  const rows = S.events.map(e => `<div class="row-item"><div class="ri-ic"><span class="ii emo gold">${ICON('party')}</span></div><div class="ri-main"><b>${esc(e.name)}</b><small>${esc(e.descr || '')} ${({ exp_mult: '经验', price_mult: '收购价', golden_mult: '变异几率', yield_mult: '产量' })[e.kind]} ×${e.params.mult}${e.params.crop != null ? `（${CROPS[e.params.crop].name}）` : ''} · 剩余 ${fmtTime((e.end_at - NET.now()) / 1000)}</small></div></div>`).join('');
  openModal(`${H2('party', '限时活动')}<div class="list">${rows || '<div class="empty">当前没有活动</div>'}</div>`, {});
}

/* ---------------- 装扮 ---------------- */
async function openDress(tab, draft) {
  tab = tab || 'avatar'; const own = new Set((await getj('/api/cosmetics') || { list: [] }).list); const me = S.me; let body = '';
  const tabs = tabsHtml([['avatar', '形象'], ['theme', '农场主题'], ['frame', '头像框'], ['title', '称号']], tab);
  if (tab === 'avatar') {
    const a = draft || Object.assign({ skin: 0, hair: 0, hat: 1, fringe: 1, pig: 0, band: 0, shirt: 0, bg: 0 }, me.avatar);
    const sw = (k, arr) => `<div class="swrow"><span>${({ skin: '肤色', hair: '发色', shirt: '衣服', band: '帽带', bg: '背景' })[k]}</span>${arr.map((c, i) => `<button class="sw${a[k] === i ? ' on' : ''}" data-k="${k}" data-v="${i}" style="background:${Array.isArray(c) ? `linear-gradient(${c[0]},${c[1]})` : c}"></button>`).join('')}</div>`;
    body = `<div class="dress"><canvas id="avprev" width="160" height="160"></canvas><div>${sw('skin', AVO.skin)}${sw('shirt', AVO.shirt)}${sw('bg', AVO.bg)}
      <div class="swrow"><span>造型</span><button class="btn sm ${a.hat ? 'primary' : ''}" data-tog="hat">草帽</button><button class="btn sm ${!a.hat && !a.pig ? 'primary' : ''}" data-tog="short">短发</button><button class="btn sm ${!a.hat && a.pig ? 'primary' : ''}" data-tog="pig">双马尾</button></div>${a.hat ? sw('band', AVO.band) : sw('hair', AVO.hair)}
      <div class="swrow"><span>昵称</span><input id="dname" maxlength="10" value="${esc(me.name)}"></div></div></div><div class="sellall"><button class="btn big primary" id="dsave">保存</button></div>`;
    openModal(`${H2('palette', '装扮')}${tabs}${body}`, {
      wide: true, mount: () => {
        bindTabs(t => openDress(t)); drawAvatar($('avprev'), avStyle(a));
        qsa('[data-k]').forEach(b => b.onclick = () => { a[b.dataset.k] = +b.dataset.v; openDress('avatar', a); });
        qsa('[data-tog]').forEach(b => b.onclick = () => { const k = b.dataset.tog; if (k === 'hat') { a.hat = 1; } else { a.hat = 0; a.pig = k === 'pig' ? 1 : 0; } openDress('avatar', a); });
        $('dsave').onclick = async () => { const r = await api('/api/me/profile', { avatar: a, name: val('dname') }); if (r) { AVC.clear(); toast('形象已保存'); renderFriends(); renderTitle(); } };
      }
    }); return;
  }
  const list = tab === 'theme' ? CFG.THEMES : tab === 'frame' ? CFG.FRAMES : null;
  if (list) body = `<div class="cosgrid">${list.map(it => { const has = own.has(tab + ':' + it.id), using = me[tab] === it.id, ach = it.ach && CFG.ACHIEVEMENTS.find(a => a.id === it.ach);
    const prev = tab === 'theme' ? `<div class="thprev" style="--roof:${it.th.roof};--wall:${it.th.wall};--tree:${it.th.tree}"><i></i><b></b><em></em></div>` : `<div class="frprev" style="box-shadow:0 0 0 4px ${it.color || 'rgba(255,255,255,.15)'}">${avHtml(me.avatar, '', 56)}</div>`;
    return `<div class="cos${using ? ' on' : ''}">${prev}<b>${it.name}</b>${using ? '<button class="btn sm" disabled>使用中</button>' : has ? `<button class="btn sm primary" data-use="${it.id}">使用</button>` : ach ? `<small>成就「${ach.tx}」解锁</small>` : `<button class="btn sm" data-cbuy="${it.id}">${G(it.price)}</button>`}</div>`; }).join('')}</div>`;
  else { const titles = CFG.ACHIEVEMENTS.filter(a => a.title); const claimed = new Set((await getj('/api/achievements') || { list: [] }).list.filter(x => x.claimed).map(x => x.id));
    body = `<div class="titles"><button class="btn sm ${!me.title ? 'primary' : ''}" data-ttl="">不佩戴</button>${titles.map(a => claimed.has(a.id) ? `<button class="btn sm ${me.title === a.title ? 'primary' : ''}" data-ttl="${esc(a.title)}">${esc(a.title)}</button>` : `<button class="btn sm" disabled title="完成成就「${a.tx}」">${ICON('lock', 'mi')}${esc(a.title)}</button>`).join('')}</div>`; }
  openModal(`${H2('palette', '装扮')}${tabs}<div class="mygold">我的金币 ${G(me.gold)}</div>${body}`, {
    wide: true, mount: () => {
      bindTabs(t => openDress(t));
      qsa('[data-use]').forEach(b => b.onclick = async () => { const r = await api('/api/me/profile', { [tab]: b.dataset.use }); if (r) { toast('已更换'); openDress(tab); } });
      qsa('[data-cbuy]').forEach(b => b.onclick = async () => { const r = await api('/api/cosmetics/buy', { kind: tab, id: b.dataset.cbuy }); if (r) { sfx('coin'); await api('/api/me/profile', { [tab]: b.dataset.cbuy }, { quiet: true }); toast('购买成功，已经换上了'); openDress(tab); } });
      qsa('[data-ttl]').forEach(b => b.onclick = async () => { const r = await api('/api/me/profile', { title: b.dataset.ttl }); if (r) openDress('title'); });
    }
  });
}

/* ---------------- 资料 / 设置 / 账号 ---------------- */
function openProfile() {
  const me = S.me, st = me.stats;
  openModal(`<div class="profile">${avHtml(me.avatar, me.frame, 84)}<h3>${esc(me.name)} <span class="lv">Lv.${me.lv}</span></h3>${me.title ? `<span class="ttl">${esc(me.title)}</span>` : ''}<p>玩家号 <b class="code">${me.code}</b> <button class="btn sm" id="pcp">${ICON('copy', 'mi')}复制邀请链接</button></p>
    <div class="stats"><div><b>${fmt(st.harvest)}</b><small>收获</small></div><div><b>${fmt(st.steal)}</b><small>摘菜</small></div><div><b>${fmt(st.help)}</b><small>互助</small></div><div><b>${fmt(st.earned)}</b><small>累计金币</small></div><div><b>${fmt(st.stolenFrom)}</b><small>被摘走</small></div></div>
    <div class="row"><button class="btn" id="pdress">${ICON('palette')}装扮</button><button class="btn" id="pgb">${ICON('mail')}我的留言板</button><button class="btn" id="pacc">${ICON('key')}账号</button></div></div>`, {
    small: true, mount: () => { $('pcp').onclick = () => copyText(inviteLink()); $('pdress').onclick = () => openDress(); $('pgb').onclick = () => openGuestbook(S.me); $('pacc').onclick = openAccount; }
  });
}
function openMenu() {
  if (!S) return;
  const row = (t, s, btn) => `<div class="row-item"><div class="ri-main"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</div>${btn}</div>`;
  openModal(`${H2('gear', '设置')}<div class="list">
    ${row('游戏音效', '', `<button class="btn sm ${PREF.sound ? 'primary' : ''}" id="tsound">${PREF.sound ? '开启' : '关闭'}</button>`)}
    ${row('背景音乐', '', `<button class="btn sm ${PREF.music ? 'primary' : ''}" id="tmusic">${PREF.music ? '开启' : '关闭'}</button>`)}
    ${row('昼夜', '', `<button class="btn sm" id="ttod">${({ auto: '跟随时间', day: '白天', dusk: '黄昏', night: '夜晚' })[PREF.tod] || '跟随时间'}</button>`)}
    ${row('成熟 / 被偷提醒', '页面在后台时，用浏览器通知提醒你（默认关闭）', `<button class="btn sm ${PREF.notify ? 'primary' : ''}" id="tnotify">${PREF.notify ? '开启' : '关闭'}</button>`)}
    ${row('账号与数据', S.me.guest ? '游客账号只能在这个浏览器登录，建议绑定' : '已绑定账号：' + esc(S.me.username), '<button class="btn sm" id="tacc">管理</button>')}
    ${row('玩法与规则', '', '<button class="btn sm" id="thelp">查看</button>')}
    ${S.me.role === 'admin' ? row('运营后台', '', '<a class="btn sm" href="admin.html" target="_blank">打开</a>') : ''}
    ${row('切换账号', '同一台设备可以保存多个账号，点头像就能切换', '<button class="btn sm primary" id="tswitch">切换</button>')}
    ${row('退出登录', '退出并从本机移除这个账号', '<button class="btn sm danger" id="tlogout">退出</button>')}</div>`, {
    small: true, mount: () => {
      $('tsound').onclick = () => { savePref({ sound: !PREF.sound }); renderHud(); openMenu(); }; $('tmusic').onclick = () => { savePref({ music: !PREF.music }); if (PREF.music) startMusic(); openMenu(); };
      $('ttod').onclick = () => { const o = ['auto', 'day', 'dusk', 'night']; savePref({ tod: o[(o.indexOf(PREF.tod) + 1) % 4] }); renderTitle(); openMenu(); };
      $('tnotify').onclick = async () => { if (!PREF.notify && 'Notification' in window) { const p = await Notification.requestPermission(); if (p !== 'granted') { toast('浏览器没有允许通知', 'warn'); return; } } else if (!('Notification' in window)) { toast('这个浏览器不支持通知', 'warn'); return; } savePref({ notify: !PREF.notify }); openMenu(); };
      $('tacc').onclick = openAccount; $('thelp').onclick = openHelp; $('tlogout').onclick = logout; $('tswitch').onclick = () => showLogin('quick', null, true);
    }
  });
}
async function logout() {
  if (S.me.guest && !confirm('你还是游客账号，退出后将无法再登录这个农场（除非先绑定账号）。确定退出吗？')) return;
  try { await NET.post('/api/auth/logout'); } catch (e) { } NET.forgetAccount(S.me.id); NET.setToken(''); try { sessionStorage.setItem('hf_pick', '1'); } catch (e) { } location.reload();
}
function openAccount() {
  const me = S.me;
  const bind = me.guest ? `<div class="mform"><b>绑定账号</b><p class="fine">绑定后可以在手机、电脑等任意设备登录这个农场</p><input id="bu" maxlength="10" placeholder="账号（也是你的游戏昵称，2–10 个字）" autocomplete="username" value="${esc(me.name)}"><input id="bp" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password"><input id="bp2" type="password" placeholder="再次输入密码" autocomplete="new-password"><button class="btn primary" id="bgo">绑定</button></div>`
    : `<div class="mform"><b>修改密码</b><input id="po" type="password" placeholder="原密码" autocomplete="current-password"><input id="pn" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password"><input id="pn2" type="password" placeholder="再次输入新密码" autocomplete="new-password"><button class="btn" id="pgo">修改</button></div>`;
  openModal(`${H2('key', '账号与数据')}<div class="acct"><p>玩家号 <b>${me.code}</b> · ${me.guest ? '游客账号' : '账号 <b>' + esc(me.username) + '</b>'} · 注册于 ${new Date(me.created_at).toLocaleDateString()}</p>${bind}
    <div class="mform"><b>我的数据</b><p class="fine">导出你在服务器上的全部游戏数据（JSON 文件）</p><button class="btn" id="exp">${ICON('download')}导出数据</button></div>
    <div class="mform danger"><b>注销账号</b><p class="fine">永久删除你的农场、仓库、好友关系和记录，无法恢复</p>${me.guest ? '<input id="dc" placeholder="输入：确认注销">' : '<input id="dc" type="password" placeholder="输入密码确认">'}<button class="btn danger" id="del">注销账号</button></div></div>`, {
    mount: () => {
      const bg = $('bgo'); if (bg) bg.onclick = async () => { if ($('bp').value !== $('bp2').value) { toast('两次输入的密码不一致', 'warn'); sfx('err'); return; } const r = await api('/api/auth/bind', { username: val('bu'), password: $('bp').value, password2: $('bp2').value }); if (r) { await refreshState(); showRecovery(r.recovery); } };
      const pg = $('pgo'); if (pg) pg.onclick = async () => { if ($('pn').value !== $('pn2').value) { toast('两次输入的新密码不一致', 'warn'); sfx('err'); return; } const r = await api('/api/auth/password', { old: $('po').value, password: $('pn').value, password2: $('pn2').value }); if (r) { NET.setToken(r.token); toast('密码已修改，其他设备需要重新登录'); closeModal(); } };
      $('exp').onclick = async () => { const d = await getj('/api/me/export'); if (!d) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })); a.download = `harvest-farm-${me.code}.json`; a.click(); };
      $('del').onclick = async () => { if (!confirm('真的要永久注销账号吗？此操作不能撤销。')) return; const v = $('dc').value; const r = await api('/api/me/delete', me.guest ? { confirm: v.trim() } : { password: v }); if (r) { NET.setToken(''); alert('账号已注销'); location.reload(); } };
    }
  });
}
function openHelp() {
  const R = RULES, P = x => Math.round(x * 100) + '%';
  openModal(`${H2('help', '玩法与规则')}<div class="help">
  <h3>基础</h3>
  <p><b>自动模式</b>：直接点击土地，系统按状态自动处理：空地播种、成熟收获、有缺水/杂草/害虫就顺手处理。按住拖动可以连续操作，滚轮可以缩放视角。</p>
  <p><b>生长</b>：所有作物的生长由服务器计时，下线也会继续长。每出现一种问题（缺水、杂草、害虫），生长速度降到 ${P(R.probSlow)}；下雨可以防止缺水。土地可以升级为红土地、黑土地、金土地，生长和产量逐级提高。红土地生长与产量 +20%。</p>
  <p><b>变异</b>：每次收获有 ${P(R.goldenChance)} 几率额外获得金色作物，价值是普通作物的 ${R.goldenPriceMult} 倍，可以收集进图鉴。</p>
  <p><b>大丰收</b>：每次收获有 ${P(R.bumperChance)} 几率额外多收 ${P(R.bumperBonus)}。等级上限 Lv.${R.maxLv}，后期还有更多高级作物等你解锁。</p>
  <h3>摘菜</h3>
  <p>不用加好友，任何玩家的农场都可以去串门。① 作物成熟后，主人有 <b>${R.stealDelaySec} 秒</b>保护时间；② 每块地每一季你只能摘一次，每次约为产量的 ${P(R.stealPctMin)}–${P(R.stealPctMax)}；③ 一块地最多被摘走 <b>${P(R.stealMaxPct)}</b>，主人至少保留 ${P(1 - R.stealMaxPct)}，Lv.${R.newbieLv} 以下的新手最多被摘 ${P(R.newbieMaxPct)}；④ 每天前 ${R.stealSoftLimit} 次摘取有经验，之后照样能摘，只是不再加经验；每次有 ${P(R.stealCritChance)} 几率<b>手气爆棚</b>，一次摘两份；⑤ 主人家的看家狗<b>福旺</b>（咬一口 5 金币）和<b>睿宝</b>（咬一口 15 金币）吃饱时会各自判定能不能抓住你，抓住了就要被咬，这一季这块地你也不能再摘了。</p>
  <p><b>互助</b>：帮别人浇水、除草、除虫，对方的作物会顺带多长 ${P(R.helpBoost)}。每天前 ${R.helpSoftLimit} 次你能得到 ${R.helpExp} 经验和 ${R.helpGold} 金币，之后仍然可以继续帮忙。</p>
  <h3>经济</h3>
  <p>作物可以卖给系统（每天有两种作物涨价），也可以交给订单（收益更高），或在集市卖给其他玩家（手续费 ${P(R.marketFee)}，价格限制在系统价的 ${R.marketMinMult}–${R.marketMaxMult} 倍）。</p>
  <p><b>时间</b>：每日任务、签到和订单在每天 0 点（北京时间）刷新；每周任务、周排行和赛季在每周一 0 点结算。</p>
  <p><b>快捷键</b>：1 自动 · 2 铲除 · 3 化肥 · Q 一键收获/摘取 · W 一键护理/帮忙 · E 一键种植 · H 回家 · Esc 关闭</p>
  </div>`, { wide: true });
}

</script>
