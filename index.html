<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>丰收农场</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#79c4f0;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;color:#5a3410;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer}
:root{--wood1:#e9b866;--wood2:#c98a3c;--wd:#6a3f14;--wdd:#4a2a0c;--paper:#fff3d6}

/* 顶栏 */
#topbar{position:fixed;left:10px;right:10px;top:10px;display:flex;align-items:flex-start;gap:12px;pointer-events:none}
#topbar>*{pointer-events:auto}
#card{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:40px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 4px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.55),0 8px 16px rgba(0,0,0,.2)}
#avatar{width:56px;height:56px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--wd);background:#cde}
#card .info{display:flex;flex-direction:column;gap:5px}
#card .nm{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:#4a2a0c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#lvbadge{background:linear-gradient(#ffb347,#ff7a1a);color:#fff;font-size:12px;padding:2px 9px;border-radius:10px;border:2px solid #a8480c;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.expbar{position:relative;width:164px;height:15px;border-radius:9px;background:#5a3410;border:2px solid #3a2008;overflow:hidden}
#expfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#9ff0ff,#2aa0f0);border-radius:9px;transition:width .4s}
#exptext{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:12px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 6px;border-radius:22px;background:linear-gradient(#5b3a1c,#3a2310);border:3px solid var(--wd);box-shadow:0 3px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.18);color:#ffe27a;font-weight:900;font-size:19px;margin-top:4px}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23a 45%,#e0a010);border:2px solid #a86f06;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);position:relative}
.coin:after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(168,111,6,.55)}
#gold.bump b{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3);color:#fff}}
#titlebar{position:fixed;left:50%;top:8px;transform:translateX(-50%);pointer-events:none}
#title{display:inline-block;position:relative;padding:7px 36px;font-size:19px;font-weight:900;color:#fff;letter-spacing:1px;background:linear-gradient(#ff8a5a,#e0502a);border:3px solid #8a2a10;border-radius:10px;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 #6a1e0a,0 8px 14px rgba(0,0,0,.25)}
#title:before,#title:after{content:"";position:absolute;top:8px;width:26px;height:100%;background:#c0401e;border:3px solid #8a2a10;z-index:-1}
#title:before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
#title:after{right:-20px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
#title small{font-size:12px;opacity:.9;margin-left:4px}
#rightbtns{margin-left:auto;display:flex;gap:8px;margin-right:84px}
#rightbtns button{width:44px;height:44px;border-radius:50%;font-size:20px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 3px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .1s}
#rightbtns button:hover{transform:translateY(-2px)}#rightbtns button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wdd)}

/* 好友栏 */
#friends{position:fixed;right:10px;top:70px;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:18px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 4px 0 var(--wdd),0 10px 20px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5)}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;width:64px;padding:4px 2px 3px;border-radius:12px;cursor:pointer;transition:transform .12s,background .12s;border:2px solid transparent}
.fr canvas{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--wd)}
.fr span{font-size:12px;font-weight:800;margin-top:3px;color:#4a2a0c}
.fr:hover{transform:translateY(-2px);background:rgba(255,255,255,.35)}
.fr.on{background:rgba(255,255,255,.55);border-color:#fff;box-shadow:0 0 0 2px #e0502a}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e8372e;color:#fff;font:900 12px/16px sans-serif;text-align:center;border:2px solid #fff;font-style:normal;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.fr .bd.hp{top:auto;bottom:16px;background:#3aa83c}
.tbtn .bd{top:2px;right:2px}.tbtn .bd.al{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}

/* 日志 */
#log{position:fixed;left:12px;bottom:112px;max-width:330px;padding:8px 12px;border-radius:12px;background:rgba(58,34,10,.62);color:#fff;font-size:13px;line-height:1.6;cursor:pointer;backdrop-filter:blur(3px)}
#log.empty{display:none}#log div{text-shadow:0 1px 1px rgba(0,0,0,.4)}#log b{color:#ffe27a}

/* 工具栏 */
#toolbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:8px 12px;border-radius:24px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 5px 0 var(--wdd),0 12px 24px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.5);max-width:calc(100vw - 20px);overflow-x:auto}
.tbtn{position:relative;width:66px;height:68px;flex:none;border:2px solid transparent;border-radius:16px;background:transparent;color:#4a2a0c;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s,background .12s}
.tbtn .ic{font-size:29px;line-height:34px;height:36px;display:flex;align-items:center;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tbtn .ic img{width:38px;height:38px;object-fit:contain}
.tbtn .tx{font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.4);transform:translateY(-4px)}
.tbtn:active{transform:translateY(0)}
.tbtn.on{background:linear-gradient(#fff6d8,#ffe08a);border-color:#e0502a;box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,200,60,.9)}
#tip{position:fixed;left:0;top:0;pointer-events:none;display:none;min-width:130px;padding:8px 12px;border-radius:12px;background:rgba(40,24,8,.88);color:#fff;font-size:13px;line-height:1.55;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:5;border:1px solid rgba(255,255,255,.2)}
#tip b{color:#ffe27a;font-size:15px}#tip .warn{color:#ffb0a0;font-weight:800}
#tip .bar{height:7px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:4px;overflow:hidden}#tip .bar i{display:block;height:100%;background:linear-gradient(#b8f08a,#4cc23c)}
#curtool{position:fixed;left:0;top:0;pointer-events:none;display:none;font-size:30px;z-index:6;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#curtool img{width:42px;height:42px;opacity:.88}

/* toast */
#toasts{position:fixed;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{padding:9px 20px;border-radius:20px;background:rgba(58,34,10,.9);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 14px rgba(0,0,0,.3);border:2px solid #ffe27a;animation:toast .3s ease-out,fade .4s 2.2s forwards;white-space:nowrap}
.toast.warn{border-color:#ff8a7a;background:rgba(90,26,16,.92)}
@keyframes toast{from{transform:translateY(-14px) scale(.9);opacity:0}}@keyframes fade{to{opacity:0;transform:translateY(-8px)}}

/* 弹窗 */
#mback{position:fixed;inset:0;background:rgba(40,22,4,.5);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
#mback.show{display:flex}
#modal{position:relative;width:min(560px,94vw);max-height:86vh;overflow:auto;padding:22px 26px 24px;border-radius:24px;background:linear-gradient(#fff8e6,#ffefc8);border:5px solid var(--wd);box-shadow:0 0 0 3px #e9b866,0 14px 0 var(--wdd),0 24px 50px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.2,1.4,.4,1);user-select:none}
#modal.small{width:min(420px,92vw)}#modal.wide{width:min(780px,95vw)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
#modal h2{margin:0 0 12px;font-size:24px;text-align:center;color:#8a3a10;text-shadow:0 2px 0 #fff}
#modal h3{margin:4px 0 8px;font-size:20px;color:#8a3a10}
#modal .sub{text-align:center;margin:-6px 0 14px;font-size:13px;opacity:.75}
#modal .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:900;background:linear-gradient(#ff8a7a,#e0402a);color:#fff;border:3px solid #8a2010;box-shadow:0 3px 0 #6a1408}
#modal .x:hover{filter:brightness(1.1)}
.btn{padding:8px 18px;border-radius:14px;border:3px solid var(--wd);background:linear-gradient(#fff2c8,#f0cf80);color:#5a3410;font-weight:900;font-size:15px;box-shadow:0 4px 0 #a87a3a;transition:transform .08s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a87a3a}
.btn.primary{background:linear-gradient(#a8f070,#4cb83c);border-color:#2a6a1c;color:#fff;box-shadow:0 4px 0 #2a6a1c;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.primary:active{box-shadow:0 1px 0 #2a6a1c}
.btn.danger{background:linear-gradient(#ff9a8a,#e0402a);border-color:#8a2010;color:#fff;box-shadow:0 4px 0 #8a2010}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:11px;border-width:2px;box-shadow:0 3px 0 #a87a3a}
.btn.primary.sm{box-shadow:0 3px 0 #2a6a1c}
.btn.big{padding:11px 34px;font-size:18px}
.btn:disabled{filter:grayscale(.8) opacity(.65);cursor:default;transform:none}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tabs button{padding:7px 22px;border-radius:14px 14px 4px 4px;border:3px solid var(--wd);background:#e8cf9a;font-weight:900;color:#7a5a2a;font-size:15px}
.tabs button.on{background:linear-gradient(#ffd96a,#f5b535);color:#4a2a0c}
.list{max-height:50vh;overflow:auto;border-radius:14px;background:rgba(255,255,255,.55);border:2px solid #e8cf9a;padding:4px 10px}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px dashed #e8cf9a}.row-item:last-child{border-bottom:0}
.ri-ic{width:54px;height:54px;flex:none;border-radius:14px;background:linear-gradient(#fff8dc,#ffe7a8);border:3px solid #e0b060;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ri-ic.big{font-size:30px}.ri-ic .cimg{width:48px;height:48px}
.ri-main{flex:1;min-width:0;line-height:1.45}.ri-main b{font-size:16px}.ri-main small{display:block;opacity:.7;font-size:12px}
.ri-n{font-weight:900;font-size:18px;min-width:56px;text-align:right;color:#8a3a10}
.price{font-weight:900;color:#c07a00;min-width:80px;text-align:right}
.empty{text-align:center;padding:36px;opacity:.6;font-weight:800}
.hots{text-align:center;min-height:4px;margin-bottom:8px;font-size:13px;font-weight:800}.hot{color:#e0501a;margin:0 4px}
.sellall{text-align:center;padding:12px 0 6px}
.mygold{text-align:right;font-weight:900;color:#c07a00;margin:-2px 4px 8px}
.seedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-height:56vh;overflow:auto;padding:4px}
.seedcard{position:relative;padding:10px 10px 8px;text-align:center;border-radius:18px;background:linear-gradient(#fffdf4,#fff0c8);border:3px solid #e0b060;cursor:pointer;transition:transform .12s,box-shadow .12s}
.seedcard:hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(120,70,10,.25)}
.seedcard.sel{border-color:#3aa83c;box-shadow:0 0 0 3px rgba(90,200,60,.5)}
.seedcard .cimg{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto}
.seedcard h4{margin:2px 0 4px;font-size:17px}
.seedcard .meta{display:flex;justify-content:space-around;font-size:12px;font-weight:800;line-height:1.6}
.seedcard .tag{position:absolute;left:-6px;top:8px;background:#e0502a;color:#fff;font-size:11px;font-style:normal;padding:2px 8px;border-radius:4px 10px 10px 4px;font-weight:900;box-shadow:0 2px 0 #8a2a10}
.seedcard.lock{filter:saturate(.35)}
.lockmask{position:absolute;inset:0;border-radius:15px;background:rgba(60,40,16,.55);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;margin:4px;padding:3px 12px 3px 4px;border-radius:20px;background:#fff;border:2px solid #e0b060;font-weight:900}
.chip img{width:30px;height:30px}
.lvup,.confirm,.welcome{text-align:center}
.lvup .burst{font-size:56px;animation:wob 1s infinite}@keyframes wob{50%{transform:rotate(12deg) scale(1.15)}}
.biglv{font-size:60px;font-weight:900;color:#ff7a1a;text-shadow:0 4px 0 #a8480c,0 0 24px rgba(255,200,60,.8);margin:-4px 0 6px}
.confirm .big{font-size:48px}.confirm .row{display:flex;gap:14px;justify-content:center;margin-top:16px}.warn{color:#e0402a;font-weight:800}
.welcome .wtitle{font-size:34px;font-weight:900;color:#e0502a;text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.15);margin-bottom:6px}
.welcome ul{text-align:left;line-height:2;font-weight:700;padding-left:22px;margin:8px 0 14px}
.checkin{background:linear-gradient(#e8f6ff,#d0ecff);border:3px solid #8ac0e8;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.cih{display:flex;align-items:center;gap:12px;margin-bottom:8px}.cih b{font-size:16px}.cih span{flex:1;font-size:12px;opacity:.7;font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;text-align:center;padding:6px 2px;border-radius:10px;background:#fff;border:2px solid #b8d8f0;font-size:12px;line-height:1.35}
.day small{display:block;opacity:.6}.day b{color:#c07a00}.day em{display:block;font-size:10px;font-style:normal;color:#e0502a}
.day.got{background:#d8f6c8;border-color:#7ac860}.day.got:after{content:"✔";position:absolute;right:2px;top:0;color:#3aa83c;font-weight:900}
.day.today{border-color:#ff7a1a;box-shadow:0 0 0 2px rgba(255,122,26,.4);animation:pulse 1.2s infinite}
.pbar{position:relative;height:16px;margin:3px 0;border-radius:8px;background:#e8d4a8;border:2px solid #c8a868;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b8f08a,#4cc23c)}
.pbar span{position:absolute;inset:0;text-align:center;font:900 11px/12px sans-serif;color:#4a2a0c;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.help p{margin:0 0 10px;line-height:1.7;font-size:14px}
.logfull .row-item{padding:7px 4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c8a060;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:820px){#titlebar{display:none}#card .expbar{width:110px}.tbtn{width:56px}#rightbtns{margin-right:70px}}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar">
  <div id="card">
    <canvas id="avatar" width="128" height="128"></canvas>
    <div class="info">
      <div class="nm"><span id="pname"></span><span id="lvbadge">Lv.1</span></div>
      <div class="expbar"><i id="expfill"></i><span id="exptext"></span></div>
    </div>
  </div>
  <div id="gold" class="pill"><span class="coin"></span><b id="goldnum">0</b></div>
  <div id="rightbtns">
    <button id="todbtn" title="时间">🌤️</button>
    <button id="btn-snd" title="声音">🔊</button>
    <button id="btn-help" title="玩法">❓</button>
    <button id="btn-menu" title="设置">⚙️</button>
  </div>
</div>
<div id="titlebar"><span id="title"></span></div>
<div id="friends"></div>
<div id="log" class="empty"></div>
<div id="toolbar"></div>
<div id="tip"></div>
<div id="curtool"></div>
<div id="toasts"></div>
<div id="mback"><div id="modal"></div></div>
<script>
'use strict';
/* ============ 基础工具 ============ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, amt) { const [r, g, b] = hex2rgb(h); if (amt >= 0) return rgb2hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt); return rgb2hex(r * (1 + amt), g * (1 + amt), b * (1 + amt)); }
function mixc(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); return rgb2hex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function ell(c, x, y, rx, ry, fill, stroke, lw, rot) {
  c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); }
}
function poly(c, pts, fill, stroke, lw) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
}
function rpath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function rrect(c, x, y, w, h, r, fill, stroke, lw) {
  rpath(c, x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); }
}
function leaf(c, x, y, len, wid, ang, fill, stroke, vein) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(0, 0);
  c.bezierCurveTo(len * 0.25, -wid, len * 0.75, -wid * 0.9, len, 0);
  c.bezierCurveTo(len * 0.75, wid * 0.9, len * 0.25, wid, 0, 0); c.closePath();
  c.fillStyle = fill; c.fill();
  if (stroke) { c.lineWidth = 1.5; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
  if (vein) { c.beginPath(); c.moveTo(len * 0.08, 0); c.lineTo(len * 0.85, 0); c.lineWidth = 1.1; c.strokeStyle = vein; c.stroke(); }
  c.restore();
}
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }

  const P = S.plots[i], cr = CROPS[S.seed], pos = plotPos(i);
  if (S.lv < cr.lv) { if (!quiet) toast(`${cr.name} 需要 Lv.${cr.lv} 解锁`, 'warn'); sfx('err'); return false; }
  if (S.gold < cr.seed) { if (!quiet) toast('金币不够买种子啦', 'warn'); sfx('err'); return false; }
  setGold(S.gold - cr.seed); P.c = S.seed; P.p = 0; P.sea = 0; P.y = cropYield(P, S.seed); P.pr = { d: 0, w: 0, b: 0 }; P.wet = 0.5;
  fxPuff(pos.x, pos.y); fxStars(pos.x, pos.y - 6, 5, '#b8e890'); fxText(pos.x, pos.y - 24, `-${cr.seed}`, '#ffd23a', 18); sfx('plant'); addExp(2); task('plant'); return true;
}
function actHarvest(i) {
  const P = S.plots[i], cr = CROPS[P.c], pos = plotPos(i), n = P.y;
  S.wh[P.c] = (S.wh[P.c] || 0) + n; sfx('harvest');
  fxCoins(pos.x, pos.y - 30, 7); fxStars(pos.x, pos.y - 40, 8); fxText(pos.x, pos.y - 50, `${cr.name} ×${n}`, '#fff6c0', 24); fxText(pos.x + 4, pos.y - 20, `+${cr.exp} 经验`, '#8fe8ff', 18);
  addExp(cr.exp); task('harvest');
  if (cr.seasons > 1 && P.sea < cr.seasons - 1) { P.sea++; P.p = 0.45; P.y = cropYield(P, P.c); P.pr = { d: 0, w: 0, b: 0 }; setTimeout(() => fxText(pos.x, pos.y - 70, '进入第二季', '#b8f08a', 17), 400); }
  else { P.c = -1; P.p = 0; P.y = 0; P.sea = 0; P.pr = { d: 0, w: 0, b: 0 }; }
  renderFriends(); return true;
}
function actCare(i) {
  const P = S.plots[i], pos = plotPos(i); const k = P.pr.d ? 'd' : P.pr.w ? 'w' : P.pr.b ? 'b' : null; if (!k) return false;
  P.pr[k] = 0;
  if (k === 'd') { P.wet = 1; fxDrops(pos.x, pos.y); sfx('water'); fxText(pos.x, pos.y - 50, '浇水 +2经验', '#8fe8ff', 17); }
  else if (k === 'w') { fxLeaves(pos.x, pos.y); sfx('weed'); fxText(pos.x, pos.y - 50, '除草 +2经验', '#b8f08a', 17); }
  else { fxPuff(pos.x, pos.y - 30); fxStars(pos.x, pos.y - 30, 6, '#ff9a9a'); sfx('bug'); fxText(pos.x, pos.y - 50, '除虫 +2经验', '#ffb0b0', 17); }
  addExp(2); task('care'); return true;
}
function actShovel(i) {
  const P = S.plots[i], pos = plotPos(i); if (P.c < 0) return false;
  if (P.p >= 1) { toast('作物已成熟，先收获吧～', 'warn'); sfx('err'); return false; }
  P.c = -1; P.p = 0; P.y = 0; P.sea = 0; P.pr = { d: 0, w: 0, b: 0 }; fxPuff(pos.x, pos.y); fxLeaves(pos.x, pos.y, '#8a6a3a'); sfx('weed'); return true;
}
function actFert(i) {
  const P = S.plots[i], pos = plotPos(i); if (P.c < 0 || P.p >= 1) return false;
  if (S.items.fert <= 0) { toast('化肥用完了，去商店买点吧', 'warn'); sfx('err'); return false; }
  S.items.fert--; P.p = Math.min(1, P.p + 0.3); fxStars(pos.x, pos.y - 30, 12, '#c8ff8a'); fxText(pos.x, pos.y - 56, '成长加速！', '#c8ff8a', 19); sfx('fert'); renderToolbar(); return true;
}
function plotCost() { const n = S.plots.filter(p => p.u).length - 6; return Math.round(500 * Math.pow(1.28, n)); }
function plotNeedLv() { const n = S.plots.filter(p => p.u).length - 6; return 2 + Math.floor(n * 0.8); }
function actExpand(i) {
  const cost = plotCost(), need = plotNeedLv(), P = S.plots[i], pos = plotPos(i);
  if (S.lv < need) { toast(`扩建这块地需要 Lv.${need}`, 'warn'); sfx('err'); return false; }
  if (S.gold < cost) { toast(`金币不足，扩建需要 ${cost} 金币`, 'warn'); sfx('err'); return false; }
  setGold(S.gold - cost); P.u = true; fxPuff(pos.x, pos.y); fxStars(pos.x, pos.y - 10, 14); fxText(pos.x, pos.y - 40, '开垦成功！', '#ffe27a', 22); sfx('level'); addExp(10); return true;
}
function redCost() { return 1500 + 600 * S.plots.filter(p => p.soil).length; }
function actRed(i) {
  const P = S.plots[i], pos = plotPos(i); if (!P.u) return false; if (P.soil) { toast('这块已经是红土地了', 'warn'); return false; }
  if (S.lv < 5) { toast('红土地需要 Lv.5', 'warn'); return false; } const c = redCost(); if (S.gold < c) { toast(`金币不足，需要 ${c}`, 'warn'); sfx('err'); return false; }
  setGold(S.gold - c); P.soil = 1; fxStars(pos.x, pos.y, 14, '#ff9a6a'); fxText(pos.x, pos.y - 40, '升级红土地！', '#ffb08a', 21); sfx('level'); addExp(15); toast('红土地：生长更快，产量 +20%'); return true;
}
function sellCrop(id, n) {
  const have = S.wh[id] || 0; n = Math.min(n, have); if (n <= 0) return 0; const g = n * unitPrice(id);
  S.wh[id] = have - n; if (!S.wh[id]) delete S.wh[id]; addGold(g); S.soldTotal += g; task('sell', g); sfx('coin'); return g;
}
function feedDog() {
  if (!S.dog.own) { toast('你还没有小狗，先去商店领养吧', 'warn'); return; } if (S.items.dogfood <= 0) { toast('没有狗粮了', 'warn'); sfx('err'); return; }
  S.items.dogfood--; S.dog.until = Math.max(S.dog.until, Date.now()) + 20 * 60000; toast('🐶 小狗吃饱啦，接下来20分钟会帮你看家'); sfx('bark'); renderToolbar();
}

/* ============ 好友农场 ============ */
function genFriend(f) {
  const bucket = Math.floor(Date.now() / 600000), start = bucket * 600000, elapsed = Date.now() - start, rnd = mulberry32(hashStr(f.id) ^ Math.imul(bucket, 2654435761));
  const nUnlock = Math.min(24, 8 + f.lv), avail = CROPS.filter(c => c.lv <= f.lv), plots = [];
  for (let i = 0; i < COLS * ROWS; i++) {
    const P = newPlot(); P.u = UNLOCK_ORDER.indexOf(i) < nUnlock; P.soil = rnd() < (f.lv > 8 ? 0.3 : 0) ? 1 : 0; P.key = `${f.id}:${bucket}:${i}`;
    if (P.u && rnd() < 0.88) {
      const cr = avail[Math.floor(rnd() * avail.length)]; P.c = cr.id; const base = rnd() < 0.45 ? 1 : rnd() * 1.05; P.p = Math.min(1, base * 0.9 + elapsed / (cr.time * 1000)); if (base >= 1) P.p = 1; P.y = cropYield(P, cr.id);
      if (P.p < 1 && P.p > 0.1 && rnd() < 0.4 && !S.helped[P.key]) P.pr[pick(['d', 'w', 'b'])] = 1;
      if (S.stolen[P.key]) { P.stolen = true; P.y = Math.max(1, Math.round(P.y * 0.8)); }
    }
    plots.push(P);
  }
  return plots;
}
function pruneKeys() { const b = Math.floor(Date.now() / 600000); [S.stolen, S.helped].forEach(o => Object.keys(o).forEach(k => { if (+k.split(':')[1] < b - 2) delete o[k]; })); }
function friendStats(f) { const ps = genFriend(f); let steal = 0, help = 0; ps.forEach(P => { if (P.u && P.c >= 0) { if (P.p >= 1 && !P.stolen) steal++; if (P.pr.d || P.pr.w || P.pr.b) help++; } }); return { steal, help }; }
function visit(f) {
  closeModal(); view = { friend: f, plots: genFriend(f), key: f.id }; S.tool = 'auto'; hoverIdx = -1; bgDirty = true; sfx('open'); $('tip').style.display = 'none';
  renderToolbar(); renderTitle(); renderFriends(); toast(`来到了 ${f.name} 的农场`);
}
function goHome() { view = { friend: null, plots: S.plots, key: 'home' }; hoverIdx = -1; bgDirty = true; sfx('open'); renderToolbar(); renderTitle(); renderFriends(); }
function fSteal(i) {
  const f = view.friend, P = view.plots[i], cr = CROPS[P.c], pos = plotPos(i);
  if (P.stolen) { toast('这块地你已经摘过了～', 'warn'); return false; }
  if (f.dog && Math.random() < f.dog) { const loss = Math.min(S.gold, rint(20, 60)); setGold(S.gold - loss); sfx('bark'); fxText(pos.x, pos.y - 40, `被狗咬了 -${loss}`, '#ff8a8a', 20); addLog(`🐕 被 <b>${f.name}</b> 家的狗咬了，损失 ${loss} 金币`); return false; }
  const n = Math.max(2, Math.min(P.y, Math.round(P.y * (0.08 + Math.random() * 0.1)))); P.stolen = true; S.stolen[P.key] = 1; S.wh[P.c] = (S.wh[P.c] || 0) + n;
  fxStars(pos.x, pos.y - 40, 8); fxText(pos.x, pos.y - 54, `${cr.name} ×${n}`, '#fff6c0', 22); fxText(pos.x, pos.y - 24, '+3 经验', '#8fe8ff', 17); sfx('steal'); addExp(3); task('steal'); addLog(`🥷 从 <b>${f.name}</b> 家摘了 ${n} 个${cr.name}`); renderFriends(); return true;
}
function fHelp(i) {
  const P = view.plots[i], pos = plotPos(i), k = P.pr.d ? 'd' : P.pr.w ? 'w' : P.pr.b ? 'b' : null; if (!k) return false; P.pr[k] = 0; S.helped[P.key] = 1;
  if (k === 'd') { fxDrops(pos.x, pos.y); sfx('water'); } else if (k === 'w') { fxLeaves(pos.x, pos.y); sfx('weed'); } else { fxStars(pos.x, pos.y - 30, 6, '#ff9a9a'); sfx('bug'); }
  fxText(pos.x, pos.y - 50, '帮忙 +4经验 +6🪙', '#b8f08a', 17); addExp(4); addGold(6); task('help'); renderFriends(); return true;
}

/* ============ 输入 ============ */
function clickPlot(i) {
  const isHome = view.key === 'home'; if (i < 0) return false; const P = view.plots[i];
  if (!isHome) {
    if (!P.u || P.c < 0) return false; if (P.p >= 1 && !P.stolen) return fSteal(i); if (P.pr.d || P.pr.w || P.pr.b) return fHelp(i); return false;
  }
  if (!P.u) { if (S.tool === 'auto') { askExpand(i); } return false; }
  switch (S.tool) {
    case 'shovel': return actShovel(i);
    case 'fert': return actFert(i);
    case 'red': return actRed(i);
    default:
      if (P.c < 0) return actPlant(i); if (P.p >= 1) return actHarvest(i); if (P.pr.d || P.pr.w || P.pr.b) return actCare(i); return false;
  }
}
function askExpand(i) {
  const cost = plotCost(), need = plotNeedLv();
  openModal(`<div class="confirm"><div class="big">🌾</div><h3>开垦新土地</h3><p>花费 <b>🪙 ${cost}</b> 金币开垦这块荒地${S.lv < need ? `<br><span class="warn">需要 Lv.${need}（当前 Lv.${S.lv}）</span>` : ''}</p>
    <div class="row"><button class="btn" onclick="closeModal()">再想想</button><button class="btn primary" id="okx">开垦</button></div></div>`, { small: true });
  $('okx').onclick = () => { closeModal(); if (actExpand(i)) { renderFriends(); } };
}
function batch(fn, list) { list.forEach((i, k) => setTimeout(() => { if (fn(i) === false) { } }, k * 70)); }
function allHarvest() { if (view.key !== 'home') return; const l = S.plots.map((P, i) => P.u && P.c >= 0 && P.p >= 1 ? i : -1).filter(i => i >= 0); if (!l.length) { toast('还没有成熟的作物～'); return; } batch(actHarvest, l); }
function allCare() { if (view.key !== 'home') return; const l = []; S.plots.forEach((P, i) => { if (P.u && P.c >= 0) { ['d', 'w', 'b'].forEach(k => { if (P.pr[k]) l.push(i); }); } }); if (!l.length) { toast('农田都很健康～'); return; } let d = 0; l.forEach(i => { setTimeout(() => actCare(i), d); d += 90; }); }
function allPlant() {
  if (view.key !== 'home') return; const cr = CROPS[S.seed]; const l = S.plots.map((P, i) => P.u && P.c < 0 ? i : -1).filter(i => i >= 0); if (!l.length) { toast('没有空地了'); return; }
  if (S.lv < cr.lv) { toast(`${cr.name} 需要 Lv.${cr.lv}`, 'warn'); return; } const can = Math.min(l.length, Math.floor(S.gold / cr.seed)); if (can <= 0) { toast('金币不够买种子啦', 'warn'); sfx('err'); return; }
  l.slice(0, can).forEach((i, k) => setTimeout(() => actPlant(i, true), k * 70));
}
function allSteal() { if (view.key === 'home') return; const l = view.plots.map((P, i) => P.u && P.c >= 0 && P.p >= 1 && !P.stolen ? i : -1).filter(i => i >= 0); if (!l.length) { toast('没有可以摘的果实了'); return; } l.forEach((i, k) => setTimeout(() => fSteal(i), k * 120)); }
function allHelp() { if (view.key === 'home') return; const l = view.plots.map((P, i) => P.u && P.c >= 0 && (P.pr.d || P.pr.w || P.pr.b) ? i : -1).filter(i => i >= 0); if (!l.length) { toast('这里不需要帮忙～'); return; } l.forEach((i, k) => setTimeout(() => fHelp(i), k * 120)); }

/* ============ HUD / 工具栏 / 好友栏 ============ */
function renderHud() {
  $('pname').textContent = S.name; $('lvbadge').textContent = 'Lv.' + S.lv;
  const need = expNeed(S.lv), pct = S.lv >= MAX_LV ? 100 : S.exp / need * 100; $('expfill').style.width = pct + '%'; $('exptext').textContent = S.lv >= MAX_LV ? '满级' : `${Math.floor(S.exp)} / ${need}`;
  $('goldnum').textContent = fmt(S.gold);
}
function renderTitle() { $('title').innerHTML = view.key === 'home' ? `🌾 ${S.name}的农场` : `🏡 ${view.friend.name}的农场 <small>Lv.${view.friend.lv}</small>`; const day = ['自动', '白天', '黄昏', '夜晚'][['auto', 'day', 'dusk', 'night'].indexOf(S.tod)]; $('todbtn').textContent = ({ auto: '🌤️', day: '☀️', dusk: '🌇', night: '🌙' })[S.tod]; $('todbtn').title = '时间：' + day + '（点击切换）'; }
function claimable() { if (S.tasks.date !== today()) resetTasks(); return TASKS.filter(t => (S.tasks.prog[t.id] || 0) >= t.need && !S.tasks.claimed[t.id]).length + (S.checkin.last !== today() ? 1 : 0); }

  const m = { seed: openSeeds, allh: allHarvest, allc: allCare, allp: allPlant, wh: openWarehouse, shop: () => openShop('item'), task: openTasks, alls: allSteal, allhp: allHelp, home: goHome }; m[id] && m[id]();
}

  }).join('');
  el.querySelectorAll('.fr').forEach(d => { const id = d.dataset.id, cv = d.querySelector('canvas'); drawAvatar(cv, id === 'me' ? MY_AV : FRIENDS.find(f => f.id === id).av); d.onclick = () => { ac(); id === 'me' ? goHome() : visit(FRIENDS.find(f => f.id === id)); }; });

/* ============ 弹窗 ============ */

}

const iconImg = id => `<img class="cimg" src="${cropIcon(id)}">`;

}
function openWarehouse(tab) {

  }
  openModal(`<h2>🎒 仓库</h2><div class="tabs"><button class="${tab === 'fruit' ? 'on' : ''}" data-t="fruit">果实</button><button class="${tab === 'item' ? 'on' : ''}" data-t="item">道具</button></div><div class="hots">${bonusTxt ? '今日行情：' + bonusTxt : ''}</div><div class="list">${body}</div>`, {

  else if (P.c < 0) h = `<b>空地${P.soil ? '（红土地）' : ''}</b><div>点击种植 ${CROPS[S.seed].name}${view.key === 'home' ? `（🪙${CROPS[S.seed].seed}）` : ''}</div>`;
  else {
    const cr = CROPS[P.c], st = stageOf(P.p), pr = [P.pr.d && '💧缺水', P.pr.w && '🌿杂草', P.pr.b && '🐛害虫'].filter(Boolean);
    h = `<b>${cr.name}${P.soil ? '（红土地）' : ''}</b><div>${STAGE_NAME[st]}${cr.seasons > 1 ? ` · 第${P.sea + 1}季` : ''}</div>`;
    h += st === 4 ? `<div>预计 ×${P.y}${P.stolen ? '（已被摘过）' : ''}</div>` : `<div>成熟还需 ${fmtTime(remainSec(P))}</div><div class="bar"><i style="width:${Math.floor(P.p * 100)}%"></i></div>`;
    if (pr.length) h += `<div class="warn">${pr.join(' ')}</div>`;
  }
  if (tip._h !== h) { tip._h = h; tip.innerHTML = h; } tip.style.display = 'block';
  const x = Math.min(window.innerWidth - 190, mouse.x + 18), y = Math.max(8, mouse.y - 80); tip.style.transform = `translate(${x}px,${y}px)`;
}

/* ============ 初始化 ============ */
function init() {
  S = loadState(); view = { friend: null, plots: S.plots, key: 'home' }; pruneKeys();
  const now = Date.now(), off = Math.min(now - S.t, 8 * 3600 * 1000);
  if (!S.fresh && off > 15000) {
    const before = S.plots.filter(P => P.u && P.c >= 0 && P.p >= 1).length; tickOwn(off, false); const after = S.plots.filter(P => P.u && P.c >= 0 && P.p >= 1).length;
    setTimeout(() => toast(`欢迎回来！离开的 ${fmtTime(off / 1000)} 里，农田${after > before ? `有 ${after - before} 块作物成熟了` : '继续生长着'}`), 600);
  }
  nextThief = now + 90000; resize(); window.addEventListener('resize', resize); renderHud(); renderTitle(); renderToolbar(); renderFriends(); renderLog();
  lastTick = now; setInterval(() => { const n = Date.now(), dt = Math.min(n - lastTick, 8 * 3600 * 1000); lastTick = n; if (dt > 0) tickOwn(dt, dt <= 3500); }, 500);
  setInterval(saveState, 6000); setInterval(() => { renderFriends(); }, 20000); window.addEventListener('beforeunload', saveState); document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
  $('mback').addEventListener('pointerdown', e => { if (e.target === $('mback')) closeModal(); });
  $('btn-help').onclick = () => { ac(); openHelp(); }; $('btn-menu').onclick = () => { ac(); openMenu(); };
  $('btn-snd').onclick = () => { ac(); S.sound = !S.sound; $('btn-snd').textContent = S.sound ? '🔊' : '🔈'; if (S.sound) { startMusic(); sfx('click'); } };
  $('btn-snd').textContent = S.sound ? '🔊' : '🔈';
  $('todbtn').onclick = () => { const o = ['auto', 'day', 'dusk', 'night']; S.tod = o[(o.indexOf(S.tod) + 1) % 4]; renderTitle(); sfx('click'); };
  $('log').onclick = () => { openModal(`<h2>📋 消息</h2><div class="list logfull">${S.log.length ? S.log.slice().reverse().map(x => `<div class="row-item"><div class="ri-main">${x.m}<small>${new Date(x.t).toLocaleTimeString()}</small></div></div>`).join('') : '<div class="empty">暂时没有消息</div>'}</div>`, { small: true }); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return; const k = e.key.toLowerCase();
    if (k === 'escape') { closeModal(); S.tool = 'auto'; renderToolbar(); updateCursor(); }
    else if ($('mback').classList.contains('show')) return;
    else if (k === '1') toolbarClick('auto'); else if (k === '2' && view.key === 'home') toolbarClick('shovel'); else if (k === '3' && view.key === 'home') toolbarClick('fert');
    else if (k === 'q') (view.key === 'home' ? allHarvest : allSteal)(); else if (k === 'w') (view.key === 'home' ? allCare : allHelp)(); else if (k === 'e') allPlant();
  });
  if (S.fresh) { S.fresh = false; welcome(); }
  document.addEventListener('pointerdown', () => { ac(); startMusic(); }, { once: true });
  requestAnimationFrame(frame);
}
window.addEventListener('DOMContentLoaded', init);

</script>
