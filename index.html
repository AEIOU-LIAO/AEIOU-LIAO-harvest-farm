<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#79c4f0">
<!-- 接口地址：留空表示和页面同域（推荐，由 Node 服务直接提供页面）；前端单独托管时填 API 域名，如 https://api.example.com -->
<meta name="farm-api" content="">
<title>丰收农场</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#79c4f0;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;color:#5a3410;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer}
:root{--wood1:#e9b866;--wood2:#c98a3c;--wd:#6a3f14;--wdd:#4a2a0c;--paper:#fff3d6}

/* 顶栏 */
#topbar{position:fixed;left:10px;right:10px;top:10px;display:flex;align-items:flex-start;gap:12px;pointer-events:none}
#topbar>*{pointer-events:auto}
#card{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:40px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 4px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.55),0 8px 16px rgba(0,0,0,.2)}
#avatar{width:56px;height:56px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--wd);background:#cde}
#card .info{display:flex;flex-direction:column;gap:5px}
#card .nm{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:#4a2a0c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#lvbadge{background:linear-gradient(#ffb347,#ff7a1a);color:#fff;font-size:12px;padding:2px 9px;border-radius:10px;border:2px solid #a8480c;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.expbar{position:relative;width:164px;height:15px;border-radius:9px;background:#5a3410;border:2px solid #3a2008;overflow:hidden}
#expfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#9ff0ff,#2aa0f0);border-radius:9px;transition:width .4s}
#exptext{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:12px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 6px;border-radius:22px;background:linear-gradient(#5b3a1c,#3a2310);border:3px solid var(--wd);box-shadow:0 3px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.18);color:#ffe27a;font-weight:900;font-size:19px;margin-top:4px}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23a 45%,#e0a010);border:2px solid #a86f06;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);position:relative}
.coin:after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(168,111,6,.55)}
#gold.bump b{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3);color:#fff}}
#titlebar{position:fixed;left:50%;top:8px;transform:translateX(-50%);pointer-events:none}
#title{display:inline-block;position:relative;padding:7px 36px;font-size:19px;font-weight:900;color:#fff;letter-spacing:1px;background:linear-gradient(#ff8a5a,#e0502a);border:3px solid #8a2a10;border-radius:10px;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 #6a1e0a,0 8px 14px rgba(0,0,0,.25)}
#title:before,#title:after{content:"";position:absolute;top:8px;width:26px;height:100%;background:#c0401e;border:3px solid #8a2a10;z-index:-1}
#title:before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
#title:after{right:-20px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
#title small{font-size:12px;opacity:.9;margin-left:4px}
#rightbtns{margin-left:auto;display:flex;gap:8px;margin-right:84px}
#rightbtns button{width:44px;height:44px;border-radius:50%;font-size:20px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 3px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .1s}
#rightbtns button:hover{transform:translateY(-2px)}#rightbtns button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wdd)}

/* 好友栏 */
#friends{position:fixed;right:10px;top:70px;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:18px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 4px 0 var(--wdd),0 10px 20px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5)}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;width:64px;padding:4px 2px 3px;border-radius:12px;cursor:pointer;transition:transform .12s,background .12s;border:2px solid transparent}
.fr canvas{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--wd)}
.fr span{font-size:12px;font-weight:800;margin-top:3px;color:#4a2a0c}
.fr:hover{transform:translateY(-2px);background:rgba(255,255,255,.35)}
.fr.on{background:rgba(255,255,255,.55);border-color:#fff;box-shadow:0 0 0 2px #e0502a}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e8372e;color:#fff;font:900 12px/16px sans-serif;text-align:center;border:2px solid #fff;font-style:normal;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.fr .bd.hp{top:auto;bottom:16px;background:#3aa83c}
.tbtn .bd{top:2px;right:2px}.tbtn .bd.al{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}

/* 日志 */
#log{position:fixed;left:12px;bottom:112px;max-width:330px;padding:8px 12px;border-radius:12px;background:rgba(58,34,10,.62);color:#fff;font-size:13px;line-height:1.6;cursor:pointer;backdrop-filter:blur(3px)}
#log.empty{display:none}#log div{text-shadow:0 1px 1px rgba(0,0,0,.4)}#log b{color:#ffe27a}

/* 工具栏 */
#toolbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:8px 12px;border-radius:24px;background:linear-gradient(#f4cd84,#d9993f);border:3px solid var(--wd);box-shadow:0 5px 0 var(--wdd),0 12px 24px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.5);max-width:calc(100vw - 20px);overflow-x:auto}
.tbtn{position:relative;width:66px;height:68px;flex:none;border:2px solid transparent;border-radius:16px;background:transparent;color:#4a2a0c;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s,background .12s}
.tbtn .ic{font-size:29px;line-height:34px;height:36px;display:flex;align-items:center;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tbtn .ic img{width:38px;height:38px;object-fit:contain}
.tbtn .tx{font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.4);transform:translateY(-4px)}
.tbtn:active{transform:translateY(0)}
.tbtn.on{background:linear-gradient(#fff6d8,#ffe08a);border-color:#e0502a;box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,200,60,.9)}
#tip{position:fixed;left:0;top:0;pointer-events:none;display:none;min-width:130px;padding:8px 12px;border-radius:12px;background:rgba(40,24,8,.88);color:#fff;font-size:13px;line-height:1.55;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:5;border:1px solid rgba(255,255,255,.2)}
#tip b{color:#ffe27a;font-size:15px}#tip .warn{color:#ffb0a0;font-weight:800}
#tip .bar{height:7px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:4px;overflow:hidden}#tip .bar i{display:block;height:100%;background:linear-gradient(#b8f08a,#4cc23c)}
#curtool{position:fixed;left:0;top:0;pointer-events:none;display:none;font-size:30px;z-index:6;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#curtool img{width:42px;height:42px;opacity:.88}

/* toast */
#toasts{position:fixed;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{padding:9px 20px;border-radius:20px;background:rgba(58,34,10,.9);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 14px rgba(0,0,0,.3);border:2px solid #ffe27a;animation:toast .3s ease-out,fade .4s 2.2s forwards;white-space:nowrap}
.toast.warn{border-color:#ff8a7a;background:rgba(90,26,16,.92)}
@keyframes toast{from{transform:translateY(-14px) scale(.9);opacity:0}}@keyframes fade{to{opacity:0;transform:translateY(-8px)}}

/* 弹窗 */
#mback{position:fixed;inset:0;background:rgba(40,22,4,.5);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
#mback.show{display:flex}
#modal{position:relative;width:min(560px,94vw);max-height:86vh;overflow:auto;padding:22px 26px 24px;border-radius:24px;background:linear-gradient(#fff8e6,#ffefc8);border:5px solid var(--wd);box-shadow:0 0 0 3px #e9b866,0 14px 0 var(--wdd),0 24px 50px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.2,1.4,.4,1);user-select:none}
#modal.small{width:min(420px,92vw)}#modal.wide{width:min(780px,95vw)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
#modal h2{margin:0 0 12px;font-size:24px;text-align:center;color:#8a3a10;text-shadow:0 2px 0 #fff}
#modal h3{margin:4px 0 8px;font-size:20px;color:#8a3a10}
#modal .sub{text-align:center;margin:-6px 0 14px;font-size:13px;opacity:.75}
#modal .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:900;background:linear-gradient(#ff8a7a,#e0402a);color:#fff;border:3px solid #8a2010;box-shadow:0 3px 0 #6a1408}
#modal .x:hover{filter:brightness(1.1)}
.btn{padding:8px 18px;border-radius:14px;border:3px solid var(--wd);background:linear-gradient(#fff2c8,#f0cf80);color:#5a3410;font-weight:900;font-size:15px;box-shadow:0 4px 0 #a87a3a;transition:transform .08s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a87a3a}
.btn.primary{background:linear-gradient(#a8f070,#4cb83c);border-color:#2a6a1c;color:#fff;box-shadow:0 4px 0 #2a6a1c;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.primary:active{box-shadow:0 1px 0 #2a6a1c}
.btn.danger{background:linear-gradient(#ff9a8a,#e0402a);border-color:#8a2010;color:#fff;box-shadow:0 4px 0 #8a2010}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:11px;border-width:2px;box-shadow:0 3px 0 #a87a3a}
.btn.primary.sm{box-shadow:0 3px 0 #2a6a1c}
.btn.big{padding:11px 34px;font-size:18px}
.btn:disabled{filter:grayscale(.8) opacity(.65);cursor:default;transform:none}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tabs button{padding:7px 22px;border-radius:14px 14px 4px 4px;border:3px solid var(--wd);background:#e8cf9a;font-weight:900;color:#7a5a2a;font-size:15px}
.tabs button.on{background:linear-gradient(#ffd96a,#f5b535);color:#4a2a0c}
.list{max-height:50vh;overflow:auto;border-radius:14px;background:rgba(255,255,255,.55);border:2px solid #e8cf9a;padding:4px 10px}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px dashed #e8cf9a}.row-item:last-child{border-bottom:0}
.ri-ic{width:54px;height:54px;flex:none;border-radius:14px;background:linear-gradient(#fff8dc,#ffe7a8);border:3px solid #e0b060;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ri-ic.big{font-size:30px}.ri-ic .cimg{width:48px;height:48px}
.ri-main{flex:1;min-width:0;line-height:1.45}.ri-main b{font-size:16px}.ri-main small{display:block;opacity:.7;font-size:12px}
.ri-n{font-weight:900;font-size:18px;min-width:56px;text-align:right;color:#8a3a10}
.price{font-weight:900;color:#c07a00;min-width:80px;text-align:right}
.empty{text-align:center;padding:36px;opacity:.6;font-weight:800}
.hots{text-align:center;min-height:4px;margin-bottom:8px;font-size:13px;font-weight:800}.hot{color:#e0501a;margin:0 4px}
.sellall{text-align:center;padding:12px 0 6px}
.mygold{text-align:right;font-weight:900;color:#c07a00;margin:-2px 4px 8px}
.seedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-height:56vh;overflow:auto;padding:4px}
.seedcard{position:relative;padding:10px 10px 8px;text-align:center;border-radius:18px;background:linear-gradient(#fffdf4,#fff0c8);border:3px solid #e0b060;cursor:pointer;transition:transform .12s,box-shadow .12s}
.seedcard:hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(120,70,10,.25)}
.seedcard.sel{border-color:#3aa83c;box-shadow:0 0 0 3px rgba(90,200,60,.5)}
.seedcard .cimg{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto}
.seedcard h4{margin:2px 0 4px;font-size:17px}
.seedcard .meta{display:flex;justify-content:space-around;font-size:12px;font-weight:800;line-height:1.6}
.seedcard .tag{position:absolute;left:-6px;top:8px;background:#e0502a;color:#fff;font-size:11px;font-style:normal;padding:2px 8px;border-radius:4px 10px 10px 4px;font-weight:900;box-shadow:0 2px 0 #8a2a10}
.seedcard.lock{filter:saturate(.35)}
.lockmask{position:absolute;inset:0;border-radius:15px;background:rgba(60,40,16,.55);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;margin:4px;padding:3px 12px 3px 4px;border-radius:20px;background:#fff;border:2px solid #e0b060;font-weight:900}
.chip img{width:30px;height:30px}
.lvup,.confirm,.welcome{text-align:center}
.lvup .burst{font-size:56px;animation:wob 1s infinite}@keyframes wob{50%{transform:rotate(12deg) scale(1.15)}}
.biglv{font-size:60px;font-weight:900;color:#ff7a1a;text-shadow:0 4px 0 #a8480c,0 0 24px rgba(255,200,60,.8);margin:-4px 0 6px}
.confirm .big{font-size:48px}.confirm .row{display:flex;gap:14px;justify-content:center;margin-top:16px}.warn{color:#e0402a;font-weight:800}
.welcome .wtitle{font-size:34px;font-weight:900;color:#e0502a;text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.15);margin-bottom:6px}
.welcome ul{text-align:left;line-height:2;font-weight:700;padding-left:22px;margin:8px 0 14px}
.checkin{background:linear-gradient(#e8f6ff,#d0ecff);border:3px solid #8ac0e8;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.cih{display:flex;align-items:center;gap:12px;margin-bottom:8px}.cih b{font-size:16px}.cih span{flex:1;font-size:12px;opacity:.7;font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;text-align:center;padding:6px 2px;border-radius:10px;background:#fff;border:2px solid #b8d8f0;font-size:12px;line-height:1.35}
.day small{display:block;opacity:.6}.day b{color:#c07a00}.day em{display:block;font-size:10px;font-style:normal;color:#e0502a}
.day.got{background:#d8f6c8;border-color:#7ac860}.day.got:after{content:"✔";position:absolute;right:2px;top:0;color:#3aa83c;font-weight:900}
.day.today{border-color:#ff7a1a;box-shadow:0 0 0 2px rgba(255,122,26,.4);animation:pulse 1.2s infinite}
.pbar{position:relative;height:16px;margin:3px 0;border-radius:8px;background:#e8d4a8;border:2px solid #c8a868;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b8f08a,#4cc23c)}
.pbar span{position:absolute;inset:0;text-align:center;font:900 11px/12px sans-serif;color:#4a2a0c;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.help p{margin:0 0 10px;line-height:1.7;font-size:14px}
.logfull .row-item{padding:7px 4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c8a060;border-radius:5px}::-webkit-scrollbar-track{background:transparent}


/* ===== v2 联网版新增 ===== */
#card{cursor:pointer}
#ptitle{font-size:11px;font-weight:900;color:#fff;background:linear-gradient(#b08aff,#7a4ad8);border:2px solid #4a2a8a;border-radius:8px;padding:0 7px;align-self:flex-start;line-height:16px}
#side{position:fixed;left:10px;top:92px;display:flex;flex-direction:column;gap:7px;z-index:2}
.sbtn{position:relative;width:54px;height:54px;border-radius:16px;border:3px solid var(--wd);background:linear-gradient(#fff2c8,#f0c070);box-shadow:0 3px 0 var(--wdd),inset 0 2px 0 rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:transform .1s}
.sbtn span{font-size:23px;line-height:26px}.sbtn em{font-style:normal;font-size:10.5px;font-weight:900;color:#5a3410}
.sbtn:hover{transform:translateY(-2px)}.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wdd)}
.sbtn.ev{background:linear-gradient(#ffd0e0,#ff8ab0);animation:pulse 1.6s infinite}
.sbtn .bd{top:-6px;right:-6px}
#newbie{position:fixed;left:74px;top:92px;width:150px;padding:8px 10px;border-radius:14px;background:linear-gradient(#e8ffd8,#b8f08a);border:3px solid #3a8a2a;box-shadow:0 3px 0 #2a6a1c;cursor:pointer;z-index:2}
#newbie b{display:block;font-size:13px;color:#2a5a1a}#newbie small{font-size:11px;color:#3a6a2a;font-weight:700}#newbie .bd{top:-8px;right:-8px}
#friends{max-height:calc(100vh - 210px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.fr .on{position:absolute;left:8px;top:6px;width:11px;height:11px;border-radius:50%;background:#4cd23c;border:2px solid #fff}
.fr.add .plus{width:48px;height:48px;border-radius:50%;border:3px dashed #8a5a2a;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#8a5a2a;background:rgba(255,255,255,.4)}
#log{max-width:360px;left:76px}#log small{opacity:.6;font-size:11px}#log .new{color:#fff6b0}#log .more{color:#ffe27a;font-weight:800}
#netbar{position:fixed;left:50%;top:0;transform:translate(-50%,-110%);padding:8px 18px;border-radius:0 0 14px 14px;background:#c8402a;color:#fff;font-weight:800;font-size:14px;z-index:60;transition:transform .3s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#netbar.show{transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#8fd4f8,#bfe9a0);z-index:70}
#loading .lt{font-size:44px;font-weight:900;color:#e0502a;text-shadow:0 3px 0 #fff,0 6px 0 rgba(0,0,0,.15);animation:wob 2s infinite}
#loading p{font-weight:800;color:#3a5a1a}#loading a{color:#c0401e}
input,select{font-family:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:3px solid #d8b070;background:#fffdf4;color:#4a2a0c;outline:none;min-width:0;user-select:text;-webkit-user-select:text}
input:focus,select:focus{border-color:#e0802a;box-shadow:0 0 0 3px rgba(255,170,60,.3)}
.login{text-align:center}.login .wtitle{font-size:36px;font-weight:900;color:#e0502a;text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.15)}
.login .sub2{margin:2px 0 12px;font-weight:700;opacity:.8}
.lform{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}.lform .sub{margin:0}
.lform a,.fine a{color:#c0401e}
.fine{font-size:12px;opacity:.7;line-height:1.5;margin:6px 0}
.invite{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;margin-bottom:12px;border-radius:14px;background:#fff;border:3px dashed #ff8a5a}.invite small{display:block;opacity:.7}
.reccode{font:900 26px/1.4 monospace;letter-spacing:3px;padding:10px;margin:8px 0;border-radius:12px;background:#fff;border:3px dashed #e0802a;user-select:all;-webkit-user-select:all}
.av{border-radius:50%;border:2px solid #fff;flex:none;background:#cde}
.ii{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}.ii.emo{font-size:28px}.ii .cimg{width:44px;height:44px}
.ii.gold{background:radial-gradient(#fff6b0,#ffd23a);box-shadow:0 0 10px #ffd23a}.ii.gold .cimg{filter:sepia(1) saturate(4) hue-rotate(5deg) brightness(1.1)}
.lv{font-size:12px;font-weight:900;color:#fff;background:#ff8a2a;border-radius:8px;padding:0 6px}
.ttl{font-size:11px;font-weight:900;color:#fff;background:#8a5ad8;border-radius:8px;padding:1px 7px}

const parts = [], floats = [];

function fxCoins(x, y, n) { for (let i = 0; i < n; i++) parts.push({ k: 'coin', x, y: y - 10, vx: (Math.random() - 0.5) * 220, vy: -200 - Math.random() * 200, g: 700, r: Math.random() * 6, t: 0, life: 0.9 + Math.random() * 0.3 }); }

function fxDrops(x, y) { for (let i = 0; i < 16; i++) parts.push({ k: 'drop', x: x + (Math.random() - 0.5) * 50, y: y - 80 - Math.random() * 30, vx: (Math.random() - 0.5) * 30, vy: 100 + Math.random() * 160, g: 600, t: 0, life: 0.55 + Math.random() * 0.2 }); }
function fxLeaves(x, y, col) { for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, v = 60 + Math.random() * 120; parts.push({ k: 'leaf', x: x + (Math.random() - 0.5) * 40, y: y - 10, vx: Math.cos(a) * v, vy: -Math.abs(Math.sin(a)) * v - 40, g: 500, r: Math.random() * 6, t: 0, life: 0.8, col: col || '#5cb83c' }); } }
function fxPuff(x, y) { for (let i = 0; i < 10; i++) { const a = Math.random() * TAU; parts.push({ k: 'puff', x, y, vx: Math.cos(a) * 50, vy: Math.sin(a) * 25 - 20, g: 0, t: 0, life: 0.5 }); } }
function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t += dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }

}
function drawFx(c) {
  parts.forEach(p => {
    const a = clamp(1 - p.t / p.life, 0, 1); c.save(); c.globalAlpha = Math.min(1, a * 1.6); c.translate(p.x, p.y);
    if (p.k === 'coin') { c.rotate(p.r + p.t * 8); const w = Math.abs(Math.cos(p.t * 10)) * 7 + 1.5; ell(c, 0, 0, w, 8, '#ffd23a', '#b8860b', 1.6); ell(c, -w * 0.2, -2, w * 0.3, 3, 'rgba(255,255,255,.7)'); }

async function boot() {

  NET.onOnline(() => { if (started) { refreshState(); loadFriends(); } });
  // 拉取服务器的有效配置（运营后台可能改过作物数值）
  for (let i = 0; i < 3; i++) {
    try { const c = await NET.get('/api/config'); c.CROPS.forEach((x, k) => { if (CROPS[k]) ['seed', 'time', 'yield', 'price', 'exp', 'lv'].forEach(f => CROPS[k][f] = x[f]); }); Object.assign(RULES, c.RULES); CFG.setTz(c.TZ_MIN); break; }
    catch (e) { $('loading').querySelector('p').textContent = '正在连接服务器…（' + (i + 1) + '）'; await new Promise(r => setTimeout(r, 1500)); }
  }

  if (NET.token) { try { const st = await NET.get('/api/state'); return enterGame(st, false); } catch (e) { if (e.code === 'network') { $('loading').querySelector('p').innerHTML = '网络异常，<a href="javascript:location.reload()">点此重试</a>'; return; } } }

function bindGlobal() {

  $('btn-help').onclick = () => { ac(); openHelp(); }; $('btn-menu').onclick = () => { ac(); openMenu(); };
  $('btn-snd').onclick = () => { ac(); savePref({ sound: !PREF.sound }); renderHud(); if (PREF.sound) { startMusic(); sfx('click'); } };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return; const k = e.key.toLowerCase();
    if (k === 'escape') { closeModal(); tool = 'auto'; renderToolbar(); updateCursor(); }
    else if ($('mback').classList.contains('show') || !S) return;
    else if (k === '1') toolbarClick('auto'); else if (k === '2' && view.key === 'home') toolbarClick('shovel'); else if (k === '3' && view.key === 'home') toolbarClick('fert');
    else if (k === 'q') (view.key === 'home' ? allHarvest : allSteal)(); else if (k === 'w') (view.key === 'home' ? allCare : allHelp)(); else if (k === 'e' && view.key === 'home') allPlant(); else if (k === 'h') goHome();
  });
  document.addEventListener('pointerdown', () => { ac(); startMusic(); }, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && started) { refreshState(); loadFriends(); if (view.key !== 'home') visitRefresh(); } });
  setInterval(() => { if (started) tickView(); }, 500);
  setInterval(() => { if (started && !document.hidden) refreshState(); }, 15000);
  setInterval(() => { if (started && !document.hidden) loadFriends(); }, 30000);
  setInterval(() => { if (started && document.hidden && PREF.notify) refreshState(); }, 60000);

  setInterval(() => { if (started && !document.hidden) renderLog(); }, 30000);
}

/* ---------------- 任务 / 签到 / 赛季 ---------------- */
async function openTasks(tab) {
  const T = await getj('/api/tasks'); if (!T) return; const nbLeft = T.newbie.filter(x => !x.claimed).length;
  tab = tab || (S.badges.newbie ? 'newbie' : 'daily');
  const row = (def, st, kind) => { const p = Math.min(st.need, st.prog), ok = st.prog >= st.need; return `<div class="row-item task"><div class="ri-ic big">${def.ic || '🌱'}</div><div class="ri-main"><b>${def.tx}</b><div class="pbar"><i style="width:${p / st.need * 100}%"></i><span>${fmt(p)}/${fmt(st.need)}</span></div><small>奖励 🪙${def.gold}${def.exp ? ' · ✨' + def.exp : ''}</small></div><button class="btn sm ${ok && !st.claimed ? 'primary' : ''}" data-claim="${def.id}" data-kind="${kind}" ${ok && !st.claimed ? '' : 'disabled'}>${st.claimed ? '已领取' : ok ? '领取' : '进行中'}</button></div>`; };
  let body = '';
  if (tab === 'daily') {
    const done = S.me.checkin.last === T.day, n = done ? ((S.me.checkin.streak - 1) % 7) + 1 : (S.me.checkin.streak % 7) + 1;
    const days = [1, 2, 3, 4, 5, 6, 7].map(d => `<div class="day${(done ? d <= n : d < n) ? ' got' : ''}${!done && d === n ? ' today' : ''}"><small>第${d}天</small><b>🪙${d * 100}</b>${d % 3 === 0 ? '<em>+🧪</em>' : ''}${d === 7 ? '<em>+🍖</em>' : ''}</div>`).join('');
    body = `<div class="checkin"><div class="cih"><b>📅 每日签到</b><span>已连续 ${S.me.checkin.streak} 天 · 每天 0 点（北京时间）刷新</span><button class="btn sm primary" id="checkin" ${done ? 'disabled' : ''}>${done ? '今日已签' : '签到'}</button></div><div class="days">${days}</div></div>
      <div class="list">${CFG.TASKS.map(d => row(d, T.daily.find(x => x.id === d.id), 'daily')).join('')}</div>`;
  } else if (tab === 'weekly') body = `<p class="sub">本周剩余 ${fmtTime((T.weekEnd - NET.now()) / 1000)}</p><div class="list">${CFG.WEEKLY.map(d => row(d, T.weekly.find(x => x.id === d.id), 'weekly')).join('')}</div>`;
  else if (tab === 'newbie') body = `<p class="sub">跟着做，几分钟就能学会多人农场的玩法</p><div class="list">${CFG.NEWBIE.map(d => row(d, T.newbie.find(x => x.id === d.id), 'newbie')).join('')}</div>${T.newbie.find(x => x.id === 'n_friend' && x.prog < 1) ? '<div class="sellall"><button class="btn primary" id="tinv">📨 复制邀请链接</button></div>' : ''}`;
  else {
    const s = await getj('/api/season'); if (!s) return;
    body = `<div class="season"><h3>🏆 本周赛季 ${s.week}</h3><p>赛季积分 = 本周获得的经验值。剩余 ${fmtTime((s.end - NET.now()) / 1000)}</p><div class="big">${fmt(s.pts)} <small>分</small></div>
      <p>结算奖励（积分 ≥ 100）：第1名 🪙5000 · 2–3名 🪙3000 · 4–10名 🪙1500 · 11–50名 🪙800 · 其余 🪙300</p>
      <div class="last">上赛季 ${s.last.week}：${s.last.pts ? `${fmt(s.last.pts)} 分 · 第 ${s.last.rank} 名 · 奖励 🪙${s.last.reward}` : '没有参加'}
      ${s.last.reward ? `<button class="btn sm ${s.last.claimed ? '' : 'primary'}" id="sclaim" ${s.last.claimed ? 'disabled' : ''}>${s.last.claimed ? '已领取' : '领取'}</button>` : ''}</div>
      <button class="btn" id="srank">查看赛季排行榜</button></div>`;
  }
  const tabs = [['daily', '每日'], ['weekly', '每周'], ['season', '赛季']]; if (nbLeft) tabs.unshift(['newbie', '新手', S.badges.newbie]);
  openModal(`<h2>📜 任务</h2>${tabsHtml(tabs, tab)}${body}`, {
    wide: true, mount: () => {
      bindTabs(openTasks);
      qsa('[data-claim]').forEach(b => b.onclick = async () => { b.disabled = true; const r = await api('/api/tasks/claim', { kind: b.dataset.kind, id: b.dataset.claim }); if (r) { sfx('coin'); toast(`领取成功！🪙+${r.result.gold}${r.result.exp ? '  ✨+' + r.result.exp : ''}`); } openTasks(tab); });
      const ci = $('checkin'); if (ci) ci.onclick = async () => { ci.disabled = true; const r = await api('/api/checkin'); if (r) { sfx('level'); toast(`签到成功！第${r.result.day}天 🪙+${r.result.gold}${r.result.back ? `，回归奖励 🪙+${r.result.back}` : ''}`); } openTasks('daily'); };
      const sc = $('sclaim'); if (sc) sc.onclick = async () => { const r = await api('/api/season/claim'); if (r) { sfx('level'); toast(`赛季奖励 🪙+${r.result.gold}`); } openTasks('season'); };
      const sr = $('srank'); if (sr) sr.onclick = () => openRank('season', 'global'); const ti = $('tinv'); if (ti) ti.onclick = () => copyText(inviteLink());
    }
  });
}

  openModal(`<h2>🏆 排行榜</h2>${tabsHtml([['lv', '等级'], ['gold', '财富'], ['harvest', '本周收获'], ['steal', '本周摘菜'], ['help', '本周互助'], ['season', '赛季积分']], dim)}
    <div class="scope"><button class="${scope === 'friends' ? 'on' : ''}" data-sc="friends">好友榜</button><button class="${scope === 'global' ? 'on' : ''}" data-sc="global">全服榜</button></div>
    ${['harvest', 'steal', 'help', 'season'].includes(dim) ? `<p class="sub">每周一 0 点（北京时间）重新计算 · 本周剩余 ${fmtTime((r.weekEnd - NET.now()) / 1000)}</p>` : ''}<div class="list">${rows || '<div class="empty">还没有数据</div>'}${mine}</div>`, {
    wide: true, mount: () => { bindTabs(d => openRank(d, scope)); qsa('[data-sc]').forEach(b => b.onclick = () => openRank(dim, b.dataset.sc)); }
  });
}
async function openAch() {
  const r = await getj('/api/achievements'); if (!r) return;
  const rows = CFG.ACHIEVEMENTS.map(a => { const s = r.list.find(x => x.id === a.id), ok = s.prog >= s.need, frame = CFG.FRAMES.find(f => f.ach === a.id); return `<div class="row-item task${s.claimed ? ' got' : ''}"><div class="ri-ic big">${s.claimed ? '🏅' : ok ? '🎁' : '🔒'}</div><div class="ri-main"><b>${a.tx}</b>${a.title ? ` <span class="ttl">称号「${a.title}」</span>` : ''}${frame ? ` <span class="ttl">${frame.name}</span>` : ''}<div class="pbar"><i style="width:${Math.min(100, s.prog / s.need * 100)}%"></i><span>${fmt(Math.min(s.prog, s.need))}/${fmt(s.need)}</span></div><small>${a.desc} · 奖励 🪙${a.gold}</small></div><button class="btn sm ${ok && !s.claimed ? 'primary' : ''}" data-ach="${a.id}" ${ok && !s.claimed ? '' : 'disabled'}>${s.claimed ? '已领取' : ok ? '领取' : '未达成'}</button></div>`; }).join('');
  openModal(`<h2>🏅 成就</h2><p class="sub">领取成就可以获得称号，在「装扮」里佩戴</p><div class="list">${rows}</div>`, {
    wide: true, mount: () => qsa('[data-ach]').forEach(b => b.onclick = async () => { const x = await api('/api/achievements/claim', { id: b.dataset.ach }); if (x) { sfx('level'); toast(`成就达成！🪙+${x.result.gold}${x.result.title ? ` 获得称号「${x.result.title}」` : ''}`); } openAch(); })
  });
}
async function openCodex() {
  const r = await getj('/api/codex'); if (!r) return; const got = {}; r.list.forEach(x => got[x.item] = x);
  const cell = (k, c, gold) => { const g = got[k]; return `<div class="cx${g ? ' on' : ''}${gold ? ' gold' : ''} r${c.rarity}" title="${g ? `首次获得：${new Date(g.first_at).toLocaleDateString()}，累计 ${g.n}` : '未获得'}">${iconImg(c.id)}<b>${gold ? '金色' : ''}${g ? c.name : '？？？'}</b><small>${CFG.RARITY[c.rarity]}${g ? ' · ×' + fmt(g.n) : ''}</small></div>`; };
  const n = CROPS.filter(c => got['c' + c.id]).length, ng = CROPS.filter(c => got['g' + c.id]).length;
  openModal(`<h2>📖 作物图鉴</h2><p class="sub">普通 ${n}/${CROPS.length} · 金色变异 ${ng}/${CROPS.length}（每次收获有 ${Math.round(RULES.goldenChance * 100)}% 几率变异）</p>
    <h4 class="sec">普通作物</h4><div class="codex">${CROPS.map(c => cell('c' + c.id, c)).join('')}</div><h4 class="sec">✨ 金色变异</h4><div class="codex">${CROPS.map(c => cell('g' + c.id, c, true)).join('')}</div>`, { wide: true });
}
function openEvents() {
  const rows = S.events.map(e => `<div class="row-item"><div class="ri-ic big">🎉</div><div class="ri-main"><b>${esc(e.name)}</b><small>${esc(e.descr || '')} ${({ exp_mult: '经验', price_mult: '收购价', golden_mult: '变异几率', yield_mult: '产量' })[e.kind]} ×${e.params.mult}${e.params.crop != null ? `（${CROPS[e.params.crop].name}）` : ''} · 剩余 ${fmtTime((e.end_at - NET.now()) / 1000)}</small></div></div>`).join('');
  openModal(`<h2>🎉 限时活动</h2><div class="list">${rows || '<div class="empty">当前没有活动</div>'}</div>`, {});
}

/* ---------------- 装扮 ---------------- */
async function openDress(tab, draft) {
  tab = tab || 'avatar'; const own = new Set((await getj('/api/cosmetics') || { list: [] }).list); const me = S.me; let body = '';
  if (tab === 'avatar') {
    const a = draft || Object.assign({ skin: 0, hair: 0, hat: 1, fringe: 1, pig: 0, band: 0, shirt: 0, bg: 0 }, me.avatar);
    const sw = (k, arr) => `<div class="swrow"><span>${({ skin: '肤色', hair: '发色', shirt: '衣服', band: '帽带', bg: '背景' })[k]}</span>${arr.map((c, i) => `<button class="sw${a[k] === i ? ' on' : ''}" data-k="${k}" data-v="${i}" style="background:${Array.isArray(c) ? `linear-gradient(${c[0]},${c[1]})` : c}"></button>`).join('')}</div>`;
    body = `<div class="dress"><canvas id="avprev" width="160" height="160"></canvas><div>${sw('skin', AVO.skin)}${sw('shirt', AVO.shirt)}${sw('bg', AVO.bg)}
      <div class="swrow"><span>造型</span><button class="btn sm ${a.hat ? 'primary' : ''}" data-tog="hat">草帽</button><button class="btn sm ${!a.hat && a.pig ? 'primary' : ''}" data-tog="pig">双马尾</button></div>${a.hat ? sw('band', AVO.band) : sw('hair', AVO.hair)}
      <div class="swrow"><span>昵称</span><input id="dname" maxlength="10" value="${esc(me.name)}"></div></div></div><div class="sellall"><button class="btn big primary" id="dsave">保存</button></div>`;
    openModal(`<h2>🎨 装扮</h2>${tabsHtml([['avatar', '形象'], ['theme', '农场主题'], ['frame', '头像框'], ['title', '称号']], tab)}${body}`, {
      wide: true, mount: () => {
        bindTabs(t => openDress(t)); drawAvatar($('avprev'), avStyle(a));
        qsa('[data-k]').forEach(b => b.onclick = () => { a[b.dataset.k] = +b.dataset.v; openDress('avatar', a); });
        qsa('[data-tog]').forEach(b => b.onclick = () => { const k = b.dataset.tog; if (k === 'hat') a.hat = a.hat ? 0 : 1; else { a.hat = 0; a.pig = a.pig ? 0 : 1; } openDress('avatar', a); });
        $('dsave').onclick = async () => { const r = await api('/api/me/profile', { avatar: a, name: val('dname') }); if (r) { toast('形象已保存'); renderFriends(); renderTitle(); } };
      }
    }); return;
  }
  const list = tab === 'theme' ? CFG.THEMES : tab === 'frame' ? CFG.FRAMES : null;
  if (list) body = `<div class="cosgrid">${list.map(it => { const has = own.has(tab + ':' + it.id), using = me[tab] === it.id, ach = it.ach && CFG.ACHIEVEMENTS.find(a => a.id === it.ach);
    const prev = tab === 'theme' ? `<div class="thprev" style="--roof:${it.th.roof};--wall:${it.th.wall};--tree:${it.th.tree}"><i></i><b></b><em></em></div>` : `<div class="frprev" style="box-shadow:0 0 0 5px ${it.color || '#ddd'}">${avHtml(me.avatar, '', 56)}</div>`;
    return `<div class="cos${using ? ' on' : ''}">${prev}<b>${it.name}</b>${using ? '<button class="btn sm" disabled>使用中</button>' : has ? `<button class="btn sm primary" data-use="${it.id}">使用</button>` : ach ? `<small>成就「${ach.tx}」解锁</small>` : `<button class="btn sm" data-cbuy="${it.id}">🪙 ${fmt(it.price)}</button>`}</div>`; }).join('')}</div>`;
  else { const titles = CFG.ACHIEVEMENTS.filter(a => a.title); const claimed = new Set((await getj('/api/achievements') || { list: [] }).list.filter(x => x.claimed).map(x => x.id));
    body = `<div class="titles"><button class="btn sm ${!me.title ? 'primary' : ''}" data-ttl="">不佩戴</button>${titles.map(a => claimed.has(a.id) ? `<button class="btn sm ${me.title === a.title ? 'primary' : ''}" data-ttl="${esc(a.title)}">${esc(a.title)}</button>` : `<button class="btn sm" disabled title="完成成就「${a.tx}」">🔒 ${esc(a.title)}</button>`).join('')}</div>`; }
  openModal(`<h2>🎨 装扮</h2>${tabsHtml([['avatar', '形象'], ['theme', '农场主题'], ['frame', '头像框'], ['title', '称号']], tab)}<div class="mygold">我的金币：🪙 ${fmt(me.gold)}</div>${body}`, {
    wide: true, mount: () => {
      bindTabs(t => openDress(t));
      qsa('[data-use]').forEach(b => b.onclick = async () => { const r = await api('/api/me/profile', { [tab]: b.dataset.use }); if (r) { bgDirty = true; toast('已更换'); openDress(tab); } });
      qsa('[data-cbuy]').forEach(b => b.onclick = async () => { const r = await api('/api/cosmetics/buy', { kind: tab, id: b.dataset.cbuy }); if (r) { sfx('coin'); await api('/api/me/profile', { [tab]: b.dataset.cbuy }, { quiet: true }); bgDirty = true; toast('购买成功，已经换上了'); openDress(tab); } });
      qsa('[data-ttl]').forEach(b => b.onclick = async () => { const r = await api('/api/me/profile', { title: b.dataset.ttl }); if (r) openDress('title'); });
    }
  });
}

/* ---------------- 资料 / 设置 / 账号 ---------------- */
function openProfile() {
  const me = S.me, st = me.stats;
  openModal(`<div class="profile">${avHtml(me.avatar, me.frame, 84)}<h3>${esc(me.name)} <span class="lv">Lv.${me.lv}</span></h3>${me.title ? `<span class="ttl">${esc(me.title)}</span>` : ''}<p>玩家号 <b class="code">${me.code}</b> <button class="btn sm" id="pcp">复制邀请链接</button></p>
    <div class="stats"><div><b>${fmt(st.harvest)}</b><small>收获</small></div><div><b>${fmt(st.steal)}</b><small>摘菜</small></div><div><b>${fmt(st.help)}</b><small>互助</small></div><div><b>${fmt(st.earned)}</b><small>累计金币</small></div><div><b>${fmt(st.stolenFrom)}</b><small>被摘走</small></div></div>
    <div class="row"><button class="btn" id="pdress">🎨 装扮</button><button class="btn" id="pgb">💌 我的留言板</button><button class="btn" id="pacc">🔐 账号</button></div></div>`, {
    small: true, mount: () => { $('pcp').onclick = () => copyText(inviteLink()); $('pdress').onclick = () => openDress(); $('pgb').onclick = () => openGuestbook(S.me); $('pacc').onclick = openAccount; }
  });
}
function openMenu() {
  if (!S) return;
  const row = (t, s, btn) => `<div class="row-item"><div class="ri-main"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</div>${btn}</div>`;
  openModal(`<h2>⚙️ 设置</h2><div class="list">
    ${row('游戏音效', '', `<button class="btn sm ${PREF.sound ? 'primary' : ''}" id="tsound">${PREF.sound ? '开启' : '关闭'}</button>`)}
    ${row('昼夜', '', `<button class="btn sm" id="ttod">${({ auto: '跟随时间', day: '白天', dusk: '黄昏', night: '夜晚' })[PREF.tod] || '跟随时间'}</button>`)}
    ${row('背景音乐', '', `<button class="btn sm ${PREF.music ? 'primary' : ''}" id="tmusic">${PREF.music ? '开启' : '关闭'}</button>`)}
    ${row('成熟 / 被偷提醒', '页面在后台时，用浏览器通知提醒你（默认关闭）', `<button class="btn sm ${PREF.notify ? 'primary' : ''}" id="tnotify">${PREF.notify ? '开启' : '关闭'}</button>`)}
    ${row('账号与数据', S.me.guest ? '⚠️ 游客账号只能在这个浏览器登录，建议绑定' : '已绑定账号：' + esc(S.me.username), '<button class="btn sm" id="tacc">管理</button>')}
    ${row('玩法与规则', '', '<button class="btn sm" id="thelp">查看</button>')}
    ${S.me.role === 'admin' ? row('运营后台', '', '<a class="btn sm" href="admin.html" target="_blank">打开</a>') : ''}
    ${row('退出登录', '', '<button class="btn sm danger" id="tlogout">退出</button>')}</div>`, {
    small: true, mount: () => {
      $('tsound').onclick = () => { savePref({ sound: !PREF.sound }); renderHud(); openMenu(); }; $('tmusic').onclick = () => { savePref({ music: !PREF.music }); if (PREF.music) startMusic(); openMenu(); };
      $('tnotify').onclick = async () => { if (!PREF.notify && 'Notification' in window) { const p = await Notification.requestPermission(); if (p !== 'granted') { toast('浏览器没有允许通知', 'warn'); return; } } else if (!('Notification' in window)) { toast('这个浏览器不支持通知', 'warn'); return; } savePref({ notify: !PREF.notify }); openMenu(); };
      $('ttod').onclick = () => { const o = ['auto', 'day', 'dusk', 'night']; savePref({ tod: o[(o.indexOf(PREF.tod) + 1) % 4] }); renderTitle(); openMenu(); };
      $('tacc').onclick = openAccount; $('thelp').onclick = openHelp; $('tlogout').onclick = logout;
    }
  });
}
async function logout() {
  if (S.me.guest && !confirm('你还是游客账号，退出后将无法再登录这个农场（除非先绑定账号）。确定退出吗？')) return;
  try { await NET.post('/api/auth/logout'); } catch (e) { } NET.setToken(''); location.reload();
}
function openAccount() {
  const me = S.me;
  const bind = me.guest ? `<div class="mform"><b>绑定账号</b><p class="fine">绑定后可以在手机、电脑等任意设备登录这个农场</p><input id="bu" placeholder="账号：4–20 位字母/数字/下划线" autocomplete="username"><input id="bp" type="password" placeholder="密码：至少 6 位" autocomplete="new-password"><button class="btn primary" id="bgo">绑定</button></div>`
    : `<div class="mform"><b>修改密码</b><input id="po" type="password" placeholder="原密码"><input id="pn" type="password" placeholder="新密码"><button class="btn" id="pgo">修改</button></div>`;
  openModal(`<h2>🔐 账号与数据</h2><div class="acct"><p>玩家号 <b>${me.code}</b> · ${me.guest ? '游客账号' : '账号 <b>' + esc(me.username) + '</b>'} · 注册于 ${new Date(me.created_at).toLocaleDateString()}</p>${bind}
    <div class="mform"><b>我的数据</b><p class="fine">导出你在服务器上的全部游戏数据（JSON 文件）</p><button class="btn" id="exp">导出数据</button></div>
    <div class="mform danger"><b>注销账号</b><p class="fine">永久删除你的农场、仓库、好友关系和记录，无法恢复</p>${me.guest ? '<input id="dc" placeholder="输入：确认注销">' : '<input id="dc" type="password" placeholder="输入密码确认">'}<button class="btn danger" id="del">注销账号</button></div></div>`, {
    mount: () => {
      const bg = $('bgo'); if (bg) bg.onclick = async () => { const r = await api('/api/auth/bind', { username: val('bu'), password: $('bp').value }); if (r) { await refreshState(); showRecovery(r.recovery); } };
      const pg = $('pgo'); if (pg) pg.onclick = async () => { const r = await api('/api/auth/password', { old: $('po').value, password: $('pn').value }); if (r) { NET.setToken(r.token); toast('密码已修改，其他设备需要重新登录'); closeModal(); } };
      $('exp').onclick = async () => { const d = await getj('/api/me/export'); if (!d) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })); a.download = `harvest-farm-${me.code}.json`; a.click(); };
      $('del').onclick = async () => { if (!confirm('真的要永久注销账号吗？此操作不能撤销。')) return; const v = $('dc').value; const r = await api('/api/me/delete', me.guest ? { confirm: v.trim() } : { password: v }); if (r) { NET.setToken(''); alert('账号已注销'); location.reload(); } };
    }
  });
}
function openHelp() {
  const R = RULES;
  openModal(`<h2>📖 玩法与规则</h2><div class="help">
  <p><b>🖐️ 自动模式</b>：直接点击土地，系统按状态自动处理——空地播种、成熟收获、有💧🌿🐛就顺手处理。按住拖动可以连续操作。</p>
  <p><b>🌱 生长</b>：所有作物的生长都由服务器计时，下线也会继续长。每出现一种问题（缺水/杂草/害虫）生长速度降到 ${Math.round(R.probSlow * 100)}%，下雨会防止缺水。红土地生长与产量 +20%。</p>
  <p><b>✨ 变异</b>：每次收获有 ${Math.round(R.goldenChance * 100)}% 几率额外获得金色作物，价值 ${R.goldenPriceMult} 倍，可收集进图鉴。</p>
  <h3>🥷 摘菜规则</h3>
  <p>① 只能摘<b>好友</b>的作物；② 作物成熟后主人有 <b>${R.stealDelaySec} 秒</b>保护时间；③ 每块地每一季你只能摘一次，每次约为产量的 ${Math.round(R.stealPctMin * 100)}–${Math.round(R.stealPctMax * 100)}%；④ 一块地最多被摘走 <b>${Math.round(R.stealMaxPct * 100)}%</b>，主人至少保留 ${Math.round((1 - R.stealMaxPct) * 100)}%；Lv.${R.newbieLv} 以下的新手最多只会被摘 ${Math.round(R.newbieMaxPct * 100)}%；⑤ 每人每天最多成功摘 ${R.stealDailyLimit} 次；⑥ 主人的小狗吃饱时有 ${Math.round(R.dogBlockBase * 100)}%（1 级）–${Math.round(Math.min(R.dogBlockMax, R.dogBlockBase + R.dogBlockPerLv * 9) * 100)}%（10 级）几率把你赶走，并咬掉 ${R.dogBiteMin}–${R.dogBiteMax} 金币，这一季这块地你就不能再摘了。</p>
  <p><b>🤝 互助</b>：帮好友浇水/除草/除虫，每次得 ${R.helpExp} 经验和 ${R.helpGold} 金币，每天最多 ${R.helpDailyLimit} 次。</p>
  <h3>💰 经济</h3>
  <p>作物可以卖给系统（每日行情🔥有两种作物涨价），也可以交给 📦订单（更高收益），或在 🏷️集市卖给其他玩家（手续费 ${Math.round(R.marketFee * 100)}%，价格限制在系统价 ${R.marketMinMult}–${R.marketMaxMult} 倍）。</p>
  <p><b>📅 时间</b>：每日任务、签到和订单在每天 0 点（北京时间）刷新；每周任务、周排行和赛季在每周一 0 点结算。</p>
  <p><b>⌨️ 快捷键</b>：1 自动 · 2 铲除 · 3 化肥 · Q 一键收获/摘取 · W 一键护理/帮忙 · E 一键种植 · H 回家 · Esc 关闭</p>
  </div>`, { wide: true });
}
